<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title>Fantasy League</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/fantasy.css">
</head>
<body>
    <div class="container-fluid">
        <div class="row">
            <!-- Left Side - Football Field -->
            <div class="col-md-6">
                <div class="football-field">
                    <div class="formation-selector mb-3">
                        <label for="formation">Formation:</label>
                        <select id="formation" class="form-select" th:value="${userTeam.formation}">
                            <option value="4-4-2">4-4-2</option>
                            <option value="4-3-3">4-3-3</option>
                            <option value="4-5-1">4-5-1</option>
                            <option value="3-5-2">3-5-2</option>
                            <option value="3-4-3">3-4-3</option>
                            <option value="5-3-2">5-3-2</option>
                            <option value="5-4-1">5-4-1</option>
                        </select>
                    </div>
                    
                    <div class="field">
                        <!-- Field positions will be dynamically populated based on formation -->
                        <div class="position-row goalkeeper">
                            <div class="player-position" data-position="GK"></div>
                        </div>
                        <div class="position-row defenders">
                            <!-- Defenders positions added dynamically -->
                        </div>
                        <div class="position-row midfielders">
                            <!-- Midfielders positions added dynamically -->
                        </div>
                        <div class="position-row forwards">
                            <!-- Forwards positions added dynamically -->
                        </div>
                    </div>
                </div>
            </div>
            
            <!-- Right Side - Player List -->
            <div class="col-md-6">
                <div class="filters mb-3">
                    <div class="row">
                        <div class="col">
                            <select id="teamFilter" class="form-select">
                                <option value="">All Teams</option>
                                <option th:each="team : ${footballTeams}"
                                        th:value="${team.id}"
                                        th:text="${team.teamName}">Team Name</option>
                            </select>
                        </div>
                        <div class="col">
                            <select id="positionFilter" class="form-select">
                                <option value="">All Positions</option>
                                <option th:each="pos : ${positions}"
                                        th:value="${pos}"
                                        th:text="${pos}">Position</option>
                            </select>
                        </div>
                    </div>
                </div>
                
                <div class="available-players">
                    <div class="player-card" th:each="player : ${availablePlayers}">
                        <div class="card">
                            <div class="card-body">
                                <h5 class="card-title" th:text="${player.name + ' ' + player.surname}">Player Name</h5>
                                <p class="card-text">
                                    <span th:text="${player.position}">Position</span> |
                                    <span th:text="${player.team?.teamName}">Team</span>
                                </p>
                                <p class="card-text">
                                    Price: <span th:text="${player.price + 'M'}">Price</span>
                                </p>
                                <button class="btn btn-primary buy-player"
                                        th:data-id="${player.football_player_id}"
                                        th:disabled="${userTeam.budgetTotal - userTeam.budgetSpent < player.price}">
                                    Buy Player
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        
        <!-- Bottom Section - Owned Players -->
        <div class="row mt-4">
            <div class="col-12">
                <h3>My Squad</h3>
                <div class="budget-info mb-3">
                    <span>Budget: </span>
                    <span th:text="${userTeam.budgetTotal - userTeam.budgetSpent + 'M available'}">Budget</span>
                </div>
                <div class="owned-players-container">
                    <div class="owned-players">
                        <div class="player-card" th:each="player : ${ownedPlayers}">
                            <div class="card">
                                <div class="card-body">
                                    <h5 class="card-title" th:text="${player.name + ' ' + player.surname}">Player Name</h5>
                                    <p class="card-text">
                                        <span th:text="${player.position}">Position</span> |
                                        <span th:text="${player.team?.teamName}">Team</span>
                                    </p>
                                    <div class="btn-group">
                                        <button class="btn btn-success select-player"
                                                th:data-id="${player.football_player_id}"
                                                th:data-position="${player.position}">
                                            Select
                                        </button>
                                        <button class="btn btn-danger sell-player"
                                                th:data-id="${player.football_player_id}">
                                            Sell
                                        </button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/fantasy.js"></script>
</body>
</html>
