<header class="premium-header text-white">
    <div class="container">
        <h1 class="mb-0">⚽ Football Match Results Details</h1>
    </div>
</header>

<section class="premium-container section-spacing">
    <div class="row mb-5">
        <div class="col-12">
            <h2 class="page-title">🏆 Match Results</h2>
            <p class="text-premium-light" style="font-size: var(--text-lg);">Detailed view of the football match results and team information</p>
        </div>
    </div>

    <div class="premium-card mb-5">
        <div class="row align-items-center">
            <!-- Home Team -->
            <div class="col-md-4 text-center">
                <div class="premium-card">
                    <h3 class="text-premium mb-4" style="color: var(--accent-green);" th:text="${match.homeTeam.teamName}">Home Team Name</h3>
                    <div class="list-group list-group-flush">
                        <div class="list-group-item border-0 px-0 py-2" th:each="player : ${match.homeTeam.players}">
                            <span class="text-readable" th:text="${player.name}">Player Name</span>
                        </div>
                    </div>
                </div>
            </div>
            
            <!-- Score -->
            <div class="col-md-4 text-center">
                <div class="premium-card">
                    <h1 class="text-premium mb-0" style="font-size: 4rem; color: var(--accent-green);">
                        <span th:text="${match.homeTeamPoints}">0</span> - <span th:text="${match.awayTeamPoints}">0</span>
                    </h1>
                    <p class="text-premium-light mt-2">Final Score</p>
                </div>
            </div>
            
            <!-- Away Team -->
            <div class="col-md-4 text-center">
                <div class="premium-card">
                    <h3 class="text-premium mb-4" style="color: var(--accent-green);" th:text="${match.awayTeam.teamName}">Away Team Name</h3>
                    <div class="list-group list-group-flush">
                        <div class="list-group-item border-0 px-0 py-2" th:each="player : ${match.awayTeam.players}">
                            <span class="text-readable" th:text="${player.name}">Player Name</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="d-flex gap-3 justify-content-center">
        <a th:href="@{/matches/results/details/stats/{id}(id=${match.football_match_id})}" class="btn-premium">📊 View Stats</a>
        <a href="/matches" class="btn-premium" style="background: var(--gray-600);">⬅️ Back to Matches</a>
    </div>
</section>
