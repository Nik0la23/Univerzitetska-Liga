<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Debug Users</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-5">
        <h2>Debug Users</h2>
        
        <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
        
        <div class="row">
            <div class="col-md-6">
                <h4>Admin User</h4>
                <p><strong>Exists:</strong> <span th:text="${adminExists}"></span></p>
                <div th:if="${adminUser}">
                    <p><strong>ID:</strong> <span th:text="${adminUser.id}"></span></p>
                    <p><strong>Name:</strong> <span th:text="${adminUser.name}"></span></p>
                    <p><strong>Email:</strong> <span th:text="${adminUser.email}"></span></p>
                </div>
            </div>
            
            <div class="col-md-6">
                <h4>User1</h4>
                <p><strong>Exists:</strong> <span th:text="${user1Exists}"></span></p>
                <div th:if="${user1User}">
                    <p><strong>ID:</strong> <span th:text="${user1User.id}"></span></p>
                    <p><strong>Name:</strong> <span th:text="${user1User.name}"></span></p>
                    <p><strong>Email:</strong> <span th:text="${user1User.email}"></span></p>
                </div>
            </div>
        </div>
        
        <div class="mt-4">
            <a href="/auth/login" class="btn btn-primary">Go to Login</a>
            <a href="/" class="btn btn-secondary">Go to Home</a>
        </div>
    </div>
</body>
</html>
