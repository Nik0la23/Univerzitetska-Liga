<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Match Details</title>
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/css/bootstrap.min.css">
    <style>
        .match-container {
            margin-bottom: 20px;
        }
        .team-container {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .team-name {
            font-weight: bold;
            font-size: 1.5em;
            margin-bottom: 15px;
            text-align: center;
            color: #000;
        }
        .team-name:hover {
            color: #6c757d;
        }
        .points {
            font-size: 2em;
            font-weight: bold;
            text-align: center;
            margin: 20px 0;
        }
        .players-container {
            text-align: center;
        }
        .players-header {
            font-weight: bold;
            margin-bottom: 10px;
        }
        .players-list {
            list-style-type: none;
            padding: 0;
            margin: 0;
        }
        .players-list li {
            margin: 5px 0;
        }
        .players-list li a {
            text-decoration: none;
            color: #000;
        }
        .players-list li a:hover {
            color: #6c757d;
        }
        .match-date-time {
            text-align: center;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
<div th:fragment="content">
    <div class="container mt-4">
        <div class="match-date-time">
            <div th:text="${#temporals.format(match.startTime.toLocalDate(), 'EEEE dd MMMM yyyy')}"></div>
            <div th:text="${#temporals.format(match.startTime, 'HH:mm')}"></div>
        </div>
        <div class="row match-container">
            <div class="col-md-5 team-container">
                <a th:href="@{/football/teams/details/{id}(id=${match.homeTeam.id})}" class="team-name" th:text="${match.homeTeam.teamName}">Home Team Name</a>
                <div class="players-container">
                    <div class="players-header">PLAYERS:</div>
                    <ul class="players-list">
                        <li th:each="player : ${match.homeTeam.players}">
                            <a th:href="@{/football/players/details/{id}(id=${player.football_player_id})}" th:text="${player.name}">Player Name</a>
                        </li>
                    </ul>
                </div>
            </div>
            <div class="col-md-2 points">
                <span th:text="${match.homeTeamPoints}">0</span> - <span th:text="${match.awayTeamPoints}">0</span>
            </div>
            <div class="col-md-5 team-container">
                <a th:href="@{/football/teams/details/{id}(id=${match.awayTeam.id})}" class="team-name" th:text="${match.awayTeam.teamName}">Away Team Name</a>
                <div class="players-container">
                    <div class="players-header">PLAYERS:</div>
                    <ul class="players-list">
                        <li th:each="player : ${match.awayTeam.players}">
                            <a th:href="@{/football/players/details/{id}(id=${player.football_player_id})}" th:text="${player.name}">Player Name</a>
                        </li>
                    </ul>
                </div>
            </div>
        </div>
        <div class="text-center mt-4">
            <a href="/football/matches" class="btn btn-secondary">Back to Matches</a>
        </div>
    </div>
</div>

<script src="https://code.jquery.com/jquery-3.2.1.slim.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.11.0/umd/popper.min.js"></script>
<script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/js/bootstrap.min.js"></script>
</body>
</html>
