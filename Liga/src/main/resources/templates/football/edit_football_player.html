<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Edit Player</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<header class="bg-primary text-white p-3">
    <div class="container">
        <h1 class="mb-0">Edit Football Player</h1>
    </div>
</header>
<div class="container mt-5">
    <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>
    <form th:action="@{/players/edit/{id}(id=${player.football_player_id})}" method="POST" enctype="multipart/form-data" class="needs-validation" novalidate sec:authorize="hasAuthority('ROLE_ADMIN')">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
        <div class="mb-3">
            <label for="playerImage" class="form-label">Player Image</label>
            <input type="file" class="form-control" id="playerImage" name="playerImage" accept="image/*" />
            <div th:if="${player.image != null}">
                <img th:src="@{/players/image/{id}(id=${player.football_player_id})}" alt="Current Image" style="width:100px;height:100px;" class="mt-2" />
            </div>
        </div>
        <div class="mb-3">
            <label for="playerName" class="form-label">Player Name</label>
            <input type="text" class="form-control" id="playerName" name="playerName" th:value="${player.name}" required placeholder="Enter player name" />
            <div class="invalid-feedback">Please enter the player's name.</div>
        </div>
        <div class="mb-3">
            <label for="playerSurname" class="form-label">Surname</label>
            <input type="text" class="form-control" id="playerSurname" name="playerSurname" th:value="${player.surname}" required placeholder="Enter player surname" />
            <div class="invalid-feedback">Please enter the player's surname.</div>
        </div>
        <div class="mb-3">
            <label for="playerBirthDate" class="form-label">Birth Date</label>
            <input type="date" class="form-control" id="playerBirthDate" name="playerBirthDate" th:value="${#dates.format(player.birthdate, 'yyyy-MM-dd')}" required />
            <div class="invalid-feedback">Please enter a valid birth date.</div>
        </div>
        <div class="mb-3">
            <label for="playerIndex" class="form-label">Index</label>
            <input type="text" class="form-control" id="playerIndex" name="playerIndex" th:value="${player.index}" required placeholder="Enter 6-digit index" pattern="\d{6}" maxlength="6" />
            <div class="invalid-feedback">Please enter a 6-digit player index.</div>
        </div>
        <div class="mb-3">
            <label for="playerCity" class="form-label">City</label>
            <input type="text" class="form-control" id="playerCity" name="playerCity" th:value="${player.city}" required placeholder="Enter player city" />
            <div class="invalid-feedback">Please enter the player's city.</div>
        </div>
        <div class="mb-3">
            <label for="playerPosition" class="form-label">Position</label>
            <select class="form-select" id="playerPosition" name="playerPosition" required>
                <option value="" disabled>Select Position</option>
                <option value="Goalkeeper" th:selected="${player.position == 'Goalkeeper'}">Goalkeeper</option>
                <option value="Defense" th:selected="${player.position == 'Defense'}">Defense</option>
                <option value="Center" th:selected="${player.position == 'Center'}">Center</option>
                <option value="Offense" th:selected="${player.position == 'Offense'}">Offense</option>
            </select>
            <div class="invalid-feedback">Please select the player's position.</div>
        </div>
        <div class="mb-3">
            <label for="teamSelect" class="form-label">Team</label>
            <select id="teamSelect" name="team" class="form-select" onchange="checkTeamPlayerCount()">
                <option value="" th:selected="${player.team == null}">No Team</option>
                <option th:each="team : ${teams}" th:value="${team.id}" th:data-player-count="${team.players.size()}" th:text="${team.teamName}" th:selected="${player.team != null && player.team.id == team.id}"></option>
            </select>
            <div class="invalid-feedback">Please select a team.</div>
        </div>
        <button id="submitButton" type="submit" class="btn btn-primary">Submit</button>
        <a href="/players" class="btn btn-secondary">Back</a>
    </form>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    (function () {
        'use strict';
        window.addEventListener('load', function () {
            var forms = document.getElementsByClassName('needs-validation');
            Array.prototype.filter.call(forms, function (form) {
                form.addEventListener('submit', function (event) {
                    var indexField = document.getElementById('playerIndex');
                    var birthdateField = document.getElementById('playerBirthDate');
                    var currentDate = new Date();
                    var birthDate = new Date(birthdateField.value);
                    if (indexField.value.length !== 6) {
                        indexField.setCustomValidity('The index must be exactly 6 digits long.');
                        event.preventDefault();
                        event.stopPropagation();
                    } else {
                        indexField.setCustomValidity('');
                    }
                    if (birthDate > currentDate) {
                        birthdateField.setCustomValidity('The birth date cannot be in the future.');
                        event.preventDefault();
                        event.stopPropagation();
                    } else {
                        birthdateField.setCustomValidity('');
                    }
                    if (form.checkValidity() === false) {
                        event.preventDefault();
                        event.stopPropagation();
                    }
                    form.classList.add('was-validated');
                }, false);
            });
        }, false);
    })();

    function checkTeamPlayerCount() {
        const teamSelect = document.getElementById('teamSelect');
        const selectedTeam = teamSelect.options[teamSelect.selectedIndex];
        const playerCount = selectedTeam.getAttribute('data-player-count');
        const submitButton = document.getElementById('submitButton');
        if (playerCount && parseInt(playerCount) >= 6) {
            alert('This team already has 6 players. You cannot add more.');
            submitButton.disabled = true;
        } else {
            submitButton.disabled = false;
        }
    }
</script>
</body>
</html>
