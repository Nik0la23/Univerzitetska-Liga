<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Match Results</title>
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/css/bootstrap.min.css">
</head>
<body>
<div th:fragment="content">
    <div class="container mt-5">
        <h2 class="mb-4">Football Match Results</h2>
        <div th:if="${results.empty}" class="alert alert-info">
            No match results available.
        </div>
        <div th:if="${!results.empty}">
            <table class="table table-striped">
                <thead>
                <tr>
                    <th scope="col">Home Team</th>
                    <th scope="col">Away Team</th>
                    <th scope="col">Score</th>
                    <th scope="col">End Time</th>
                    <th scope="col">Actions</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="match : ${results}">
                    <td th:text="${match.homeTeam.teamName}"></td>
                    <td th:text="${match.awayTeam.teamName}"></td>
                    <td th:text="${match.homeTeamPoints} + ' - ' + ${match.awayTeamPoints}"></td>
                    <td th:text="${#temporals.format(match.endTime, 'dd-MM-yyyy HH:mm')}"></td>
                    <td>
                        <a th:href="@{/football/matches/results/details/{id}(id=${match.football_match_id})}" class="btn btn-info btn-sm">Details</a>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
        <div class="mt-4">
            <a href="/football/matches" class="btn btn-secondary">Back to Matches</a>
        </div>
    </div>
</div>
</body>
</html>
