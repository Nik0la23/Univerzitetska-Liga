<header class="premium-header text-white">
    <div class="container">
        <h1 class="mb-0">🏆 Football Teams</h1>
    </div>
</header>

<section class="premium-container">
    <div class="row mb-4">
        <div class="col-12">
            <h2 class="text-premium" style="color: var(--accent-green); font-size: var(--text-2xl); margin-bottom: var(--space-6);">
                ⚽ All Football Teams
            </h2>
        </div>
    </div>
    
    <div class="text-center mb-4" th:if="${session.user != null and session.user.isAdmin}">
        <a th:href="@{/teams/add}" class="btn btn-premium btn-success">➕ Add New Team</a>
    </div>
    
    <div class="table-responsive">
        <table class="table-premium">
            <thead>
            <tr>
                <th>🏆 Team Logo</th>
                <th>👥 Team Name</th>
                <th>👁️ Details</th>
                <th th:if="${session.user != null and session.user.isAdmin}">✏️ Edit</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="team : ${footballTeams}">
                <td>
                    <img th:src="@{/teams/logo/{id}(id=${team.id})}" 
                         alt="Team Image" 
                         style="width:60px;height:60px;border-radius:50%;object-fit:cover;border:2px solid var(--accent-green);"/>
                </td>
                <td class="text-premium" th:text="${team.teamName}"></td>
                <td>
                    <a th:href="@{/teams/team/{id}(id=${team.id})}" class="btn btn-premium btn-primary" style="padding: var(--space-2) var(--space-3); font-size: var(--text-xs);">👁️ Details</a>
                </td>
                <td th:if="${session.user != null and session.user.isAdmin}">
                    <a th:href="@{/teams/edit/{id}(id=${team.id})}" class="btn btn-premium btn-warning" style="padding: var(--space-2) var(--space-3); font-size: var(--text-xs);">✏️ Edit</a>
                </td>
                
            </tr>
            </tbody>
        </table>
    </div>
</section>
