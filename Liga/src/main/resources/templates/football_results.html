<header class="premium-header text-white">
    <div class="container">
        <h1 class="mb-0">📊 Football Match Results</h1>
    </div>
</header>

<section class="premium-container section-spacing">
    <div class="row mb-5">
        <div class="col-12">
            <h2 class="page-title">
                🏆 Match Results
            </h2>
            <p class="text-premium-light" style="font-size: var(--text-lg);">
                View completed football matches and their final scores
            </p>
        </div>
    </div>
    
    <div class="table-responsive">
        <table class="table-premium">
            <thead>
            <tr>
                <th>🏠 Home Team</th>
                <th>✈️ Away Team</th>
                <th>📊 Final Score</th>
                <th>⏰ End Time</th>
                <th>⚙️ Actions</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="match : ${results}">
                <td class="text-readable" th:text="${match.homeTeam.teamName}"></td>
                <td class="text-readable" th:text="${match.awayTeam.teamName}"></td>
                <td>
                    <span class="badge-premium badge-success" th:text="${match.homeTeamPoints} + ' - ' + ${match.awayTeamPoints}"></span>
                </td>
                <td class="text-readable" th:text="${#temporals.format(match.endTime, 'dd-MM-yyyy HH:mm')}"></td>
                <td>
                    <a th:href="@{/matches/results/details/{id}(id=${match.football_match_id})}" 
                       class="btn btn-premium btn-primary" style="padding: var(--space-2) var(--space-3); font-size: var(--text-xs);">👁️ Details</a>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
    
    <div class="text-center mt-4">
        <button type="button" class="btn btn-premium btn-secondary" onclick="window.history.back()">⬅️ Back</button>
    </div>
</section>
