<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Volleyball Matches</title>
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/css/bootstrap.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800&family=Source+Sans+Pro:wght@300;400;600;700&display=swap');
        
        body {
            font-family: 'Source Sans Pro', sans-serif;
            background: linear-gradient(135deg, #0f4c75 0%, #3282b8 50%, #bbe1fa 100%);
            min-height: 100vh;
            color: #333;
            position: relative;
            overflow-x: hidden;
            scroll-behavior: smooth;
        }
        
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><circle cx="25" cy="25" r="3" fill="rgba(255,255,255,0.1)"/><circle cx="75" cy="75" r="2" fill="rgba(255,255,255,0.08)"/><circle cx="50" cy="10" r="1" fill="rgba(255,255,255,0.1)"/><circle cx="10" cy="60" r="2" fill="rgba(255,255,255,0.06)"/><circle cx="90" cy="40" r="1" fill="rgba(255,255,255,0.1)"/></svg>');
            animation: volleyballFloat 30s infinite linear;
            z-index: -1;
        }
        
        @keyframes volleyballFloat {
            0% { transform: translateX(-100px) translateY(0px); }
            25% { transform: translateX(25vw) translateY(-20px); }
            50% { transform: translateX(50vw) translateY(0px); }
            75% { transform: translateX(75vw) translateY(-15px); }
            100% { transform: translateX(calc(100vw + 100px)) translateY(0px); }
        }
        
        .premium-header {
            background: linear-gradient(135deg, #0f4c75 0%, #3282b8 50%, #0f4c75 100%);
            border-bottom: 4px solid #bbe1fa;
            box-shadow: 0 8px 32px rgba(11,76,117,0.4);
            position: relative;
            overflow: hidden;
        }
        
        .premium-header::after {
            content: '';
            position: absolute;
            top: -30%;
            left: -20%;
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, rgba(187,225,250,0.2) 0%, transparent 70%);
            border-radius: 50%;
            animation: volleyballBounce 4s infinite;
        }
        
        @keyframes volleyballBounce {
            0%, 100% { transform: translateY(0) scale(1); }
            25% { transform: translateY(-30px) scale(1.1); }
            50% { transform: translateY(0) scale(1); }
            75% { transform: translateY(-15px) scale(1.05); }
        }
        
        .premium-header h1 {
            font-family: 'Montserrat', sans-serif;
            font-weight: 800;
            font-size: 3.2rem;
            color: #fff;
            text-shadow: 0 0 25px rgba(187,225,250,0.6);
            margin: 0;
            position: relative;
            z-index: 2;
            text-transform: uppercase;
            letter-spacing: 3px;
        }
        
        .premium-nav {
            background: rgba(255,255,255,0.95);
            backdrop-filter: blur(20px);
            border-bottom: 2px solid rgba(50,130,184,0.3);
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
        }
        
        .premium-nav .nav-link {
            color: #0f4c75 !important;
            font-weight: 600;
            padding: 15px 20px !important;
            margin: 0 5px;
            border-radius: 15px;
            transition: all 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            position: relative;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-size: 0.9rem;
            overflow: hidden;
        }
        
        .premium-nav .nav-link::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(50,130,184,0.2), transparent);
            transition: left 0.6s ease;
        }
        
        .premium-nav .nav-link:hover::before {
            left: 100%;
        }
        
        .premium-nav .nav-link:hover {
            background: linear-gradient(135deg, #3282b8, #0f4c75);
            color: white !important;
            transform: translateY(-3px) scale(1.05);
            box-shadow: 0 8px 25px rgba(50,130,184,0.4);
        }
        
        .premium-container {
            background: rgba(255,255,255,0.95);
            backdrop-filter: blur(20px);
            border-radius: 30px;
            padding: 50px;
            margin: 40px auto;
            max-width: 1200px;
            box-shadow: 0 25px 80px rgba(15,76,117,0.15);
            border: 2px solid rgba(187,225,250,0.3);
            position: relative;
            z-index: 1;
        }
        
        .premium-container::before {
            content: '';
            position: absolute;
            top: -2px;
            left: -2px;
            right: -2px;
            bottom: -2px;
            background: linear-gradient(45deg, #3282b8, #0f4c75, #bbe1fa, #3282b8);
            border-radius: 30px;
            z-index: -1;
            animation: volleyballGradient 5s ease infinite;
        }
        
        @keyframes volleyballGradient {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }
        
        .match-date {
            font-family: 'Montserrat', sans-serif;
            font-size: 2.2rem;
            font-weight: 700;
            color: #0f4c75;
            margin: 40px 0 25px 0;
            text-align: center;
            position: relative;
            padding-bottom: 20px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        
        .match-date::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 120px;
            height: 4px;
            background: linear-gradient(90deg, #3282b8, #0f4c75, #bbe1fa);
            border-radius: 2px;
            animation: volleyballGlow 3s ease-in-out infinite;
        }
        
        @keyframes volleyballGlow {
            0%, 100% { box-shadow: 0 0 8px rgba(50,130,184,0.5); }
            50% { box-shadow: 0 0 25px rgba(50,130,184,0.8); }
        }
        
        .match-card {
            background: linear-gradient(135deg, #fff 0%, #f8fbff 100%);
            border: none;
            border-radius: 25px;
            padding: 35px;
            margin: 20px 0;
            box-shadow: 0 15px 35px rgba(50,130,184,0.1);
            transition: all 0.5s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            position: relative;
            overflow: hidden;
            transform-style: preserve-3d;
        }
        
        .match-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 6px;
            height: 100%;
            background: linear-gradient(180deg, #3282b8, #0f4c75);
            transform: scaleY(0);
            transition: transform 0.4s ease;
            border-radius: 0 3px 3px 0;
        }
        
        .match-card::after {
            content: '';
            position: absolute;
            top: -50%;
            right: -50%;
            width: 250px;
            height: 250px;
            background: radial-gradient(circle, rgba(50,130,184,0.05) 0%, transparent 70%);
            border-radius: 50%;
            transition: all 0.5s ease;
        }
        
        .match-card:hover::before {
            transform: scaleY(1);
        }
        
        .match-card:hover::after {
            top: -30%;
            right: -30%;
            background: radial-gradient(circle, rgba(50,130,184,0.1) 0%, transparent 70%);
        }
        
        .match-card:hover {
            transform: translateY(-15px) rotateX(3deg);
            box-shadow: 0 30px 60px rgba(50,130,184,0.2);
        }
        
        .match-link {
            display: block;
            width: 100%;
            color: inherit;
            text-decoration: none;
            position: relative;
            z-index: 2;
        }
        
        .match-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        
        .match-details {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 40px;
        }
        
        .team-name {
            font-size: 1.5rem;
            color: #0f4c75;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.1);
            transition: all 0.3s ease;
        }
        
        .match-card:hover .team-name {
            color: #3282b8;
            transform: scale(1.05);
        }
        
        .match-time {
            font-family: 'Montserrat', sans-serif;
            font-size: 1.3rem;
            padding: 18px 30px;
            background: linear-gradient(135deg, #3282b8, #0f4c75);
            color: white;
            border-radius: 35px;
            font-weight: 700;
            box-shadow: 0 8px 25px rgba(50,130,184,0.4);
            min-width: 120px;
            text-align: center;
            position: relative;
            overflow: hidden;
        }
        
        .match-time::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
            transition: left 0.6s ease;
        }
        
        .match-card:hover .match-time::before {
            left: 100%;
        }
        
        .vs-text {
            font-family: 'Montserrat', sans-serif;
            font-size: 1.4rem;
            color: #3282b8;
            font-weight: 600;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.1);
            font-style: italic;
        }
        
        .actions {
            display: flex;
            gap: 18px;
            align-items: center;
            margin-top: 25px;
            justify-content: center;
        }
        
        .btn-premium {
            padding: 14px 24px;
            border-radius: 30px;
            font-weight: 600;
            font-size: 0.9rem;
            border: none;
            transition: all 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            text-transform: uppercase;
            letter-spacing: 1px;
            position: relative;
            overflow: hidden;
        }
        
        .btn-premium::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            background: rgba(255,255,255,0.2);
            border-radius: 50%;
            transition: all 0.4s ease;
            transform: translate(-50%, -50%);
        }
        
        .btn-premium:hover::before {
            width: 350px;
            height: 350px;
        }
        
        .btn-premium.btn-warning {
            background: linear-gradient(135deg, #FF9800, #FFB74D);
            color: white;
            box-shadow: 0 8px 25px rgba(255,152,0,0.4);
        }
        
        .btn-premium.btn-success {
            background: linear-gradient(135deg, #4CAF50, #66BB6A);
            color: white;
            box-shadow: 0 8px 25px rgba(76,175,80,0.4);
        }
        
        .btn-premium.btn-danger {
            background: linear-gradient(135deg, #F44336, #EF5350);
            color: white;
            box-shadow: 0 8px 25px rgba(244,67,54,0.4);
        }
        
        .btn-premium:hover {
            transform: translateY(-4px) scale(1.05);
            box-shadow: 0 15px 35px rgba(0,0,0,0.2);
        }
        
        .playoff-badge {
            background: linear-gradient(135deg, #3282b8, #0f4c75);
            color: white;
            padding: 10px 20px;
            border-radius: 30px;
            font-size: 0.85rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: 0 6px 20px rgba(50,130,184,0.4);
            position: absolute;
            top: 25px;
            right: 25px;
            animation: volleyballPulse 3s infinite;
            z-index: 3;
        }
        
        @keyframes volleyballPulse {
            0%, 100% { 
                box-shadow: 0 6px 20px rgba(50,130,184,0.4);
                transform: scale(1);
            }
            50% { 
                box-shadow: 0 10px 30px rgba(50,130,184,0.6);
                transform: scale(1.05);
            }
        }
        
        .volleyball-icon {
            position: absolute;
            top: 50%;
            right: 45px;
            transform: translateY(-50%);
            font-size: 3rem;
            color: rgba(50,130,184,0.12);
            z-index: 1;
            animation: volleyballServe 3s ease-in-out infinite;
        }
        
        @keyframes volleyballServe {
            0%, 100% { 
                transform: translateY(-50%) rotate(0deg) scale(1);
            }
            25% { 
                transform: translateY(-60%) rotate(90deg) scale(1.1);
            }
            50% { 
                transform: translateY(-50%) rotate(180deg) scale(1);
            }
            75% { 
                transform: translateY(-40%) rotate(270deg) scale(1.1);
            }
        }
        
        @media (max-width: 768px) {
            .match-details {
                flex-direction: column;
                gap: 25px;
            }
            
            .actions {
                flex-direction: column;
                width: 100%;
            }
            
            .premium-container {
                margin: 20px;
                padding: 30px;
            }
            
            .premium-header h1 {
                font-size: 2.2rem;
            }
        }
    </style>
</head>
<body>
<header class="premium-header text-white p-4">
    <div class="container">
        <h1 class="mb-0">🏐 Volleyball Matches</h1>
    </div>
</header>

<nav class="navbar navbar-expand-lg premium-nav">
    <div class="container">
        <div class="collapse navbar-collapse">
            <ul class="navbar-nav mr-auto">
                <li class="nav-item">
                    <a href="/volleyball/news" class="nav-link">📰 News</a>
                </li>
                <li class="nav-item">
                    <a href="/volleyball/matches/add-form" class="nav-link">➕ Add Match</a>
                </li>
                <li class="nav-item">
                    <a href="/volleyball/matches/live" class="nav-link">🔴 Live Matches</a>
                </li>
                <li class="nav-item">
                    <a href="/volleyball/matches/fixtures" class="nav-link">📅 Fixtures</a>
                </li>
                <li class="nav-item">
                    <a href="/volleyball/matches/results" class="nav-link">📊 Results</a>
                </li>
                <li class="nav-item">
                    <a href="/volleyball/players" class="nav-link">👥 Players</a>
                </li>
                <li class="nav-item">
                    <a href="/volleyball/teams/standings" class="nav-link">🏆 Standings</a>
                </li>
                <li class="nav-item">
                    <a href="/volleyball/matches/playoffs/init" class="nav-link">⚡ Playoffs</a>
                </li>
            </ul>
        </div>
    </div>
</nav>

<section class="premium-container">
    <div th:each="entry : ${groupedMatches}">
        <h3 class="match-date" th:text="${#temporals.format(entry.key, 'EEEE dd MMMM yyyy')}"></h3>
        <div th:each="match : ${entry.value}" class="match-card">
            <span th:if="${match.isVolleyballPlayoffMatch}" class="playoff-badge">🏆 Playoff</span>
            <div class="volleyball-icon">🏐</div>
            <a th:href="@{/volleyball/matches/details/{id}(id=${match.volleyball_match_id})}" class="match-link">
                <div class="match-row">
                    <div class="match-details">
                        <span class="team-name" th:text="${match.homeTeam.teamName}"></span>
                        <span class="vs-text">vs</span>
                        <span class="team-name" th:text="${match.awayTeam.teamName}"></span>
                        <span class="match-time" th:text="${#temporals.format(match.startTime, 'HH:mm')}"></span>
                    </div>
                </div>
            </a>
            <div class="actions">
                <a th:href="@{/volleyball/matches/edit-form/{id}(id=${match.volleyball_match_id})}" class="btn btn-warning btn-premium">✏️ Edit</a>
                <form th:if="${!match.isVolleyballPlayoffMatch}" th:method="POST" th:action="@{'/volleyball/matches/finish/{id}'(id=${match.volleyball_match_id})}" style="display:inline;" onsubmit="return confirmFinish(this)">
                    <input id="homeTeamScoreInput" type="hidden" name="homeTeamScore" th:value="${match.homeTeamPoints}">
                    <input id="awayTeamScoreInput" type="hidden" name="awayTeamScore" th:value="${match.awayTeamPoints}">
                    <button th:disabled="${match.homeTeamPoints == match.awayTeamPoints}" type="submit" class="btn btn-success btn-premium">✅ Finish</button>
                </form>
                <form th:method="POST" th:action="@{'/volleyball/matches/delete/{id}'(id=${match.volleyball_match_id})}" style="display:inline;">
                    <button type="submit" class="btn btn-danger btn-premium">🗑️ Delete</button>
                </form>
            </div>
        </div>
    </div>
</section>

<script>
    function confirmFinish(form) {
        if (form.dataset.isFinished) {
            alert("This match has already been finished.");
            return false;
        }
        form.dataset.isFinished = true;
        return true;
    }
</script>

<script src="https://code.jquery.com/jquery-3.2.1.slim.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.11.0/umd/popper.min.js"></script>
<script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/js/bootstrap.min.js"></script>
</body>
</html>
