<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Edit Live Match</title>
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/css/bootstrap.min.css">
    <style>
        .set-score {
            font-size: 1.2em;
            font-weight: bold;
        }
        .current-set {
            background-color: #e9ecef;
            padding: 10px;
            border-radius: 5px;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
<header class="bg-primary text-white p-3">
    <div class="container">
        <h1 class="mb-0">Edit Live Volleyball Match</h1>
    </div>
</header>

<div class="container mt-4">
    <div class="current-set mb-4">
        <h3>Match Score</h3>
        <div class="row">
            <div class="col">
                <h4 th:text="${match.homeTeam.teamName}">Home Team</h4>
                <span class="h2" th:text="${match.homeTeamPoints}">0</span> sets
            </div>
            <div class="col">
                <h4 th:text="${match.awayTeam.teamName}">Away Team</h4>
                <span class="h2" th:text="${match.awayTeamPoints}">0</span> sets
            </div>
        </div>
        
        <h3 class="mt-4">Set Scores</h3>
        <table class="table">
            <thead>
                <tr>
                    <th>Team</th>
                    <th>Set 1</th>
                    <th>Set 2</th>
                    <th>Set 3</th>
                    <th>Set 4</th>
                    <th>Set 5</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td th:text="${match.homeTeam.teamName}">Home Team</td>
                    <td th:text="${match.homeTeamSet1Points}">0</td>
                    <td th:text="${match.homeTeamSet2Points}">0</td>
                    <td th:text="${match.homeTeamSet3Points}">0</td>
                    <td th:text="${match.homeTeamSet4Points}">0</td>
                    <td th:text="${match.homeTeamSet5Points}">0</td>
                </tr>
                <tr>
                    <td th:text="${match.awayTeam.teamName}">Away Team</td>
                    <td th:text="${match.awayTeamSet1Points}">0</td>
                    <td th:text="${match.awayTeamSet2Points}">0</td>
                    <td th:text="${match.awayTeamSet3Points}">0</td>
                    <td th:text="${match.awayTeamSet4Points}">0</td>
                    <td th:text="${match.awayTeamSet5Points}">0</td>
                </tr>
            </tbody>
        </table>
    </div>

    <form action="/volleyball/matches/edit_live" method="post">
        <input type="hidden" name="volleyballMatchId" th:value="${match.volleyball_match_id}">
        <input type="hidden" name="currentSet" th:value="${match.currentSet}">

        <div class="form-group">
            <label for="teamId">Select Team:</label>
            <select class="form-control" id="teamId" name="teamId" required>
                <option value="">Select Team</option>
                <option th:each="team : ${teams}" 
                        th:value="${team.getVolleyball_team_id()}" 
                        th:text="${team.getTeamName()}"></option>
            </select>
        </div>

        <div class="form-group">
            <label for="playerId">Select Player:</label>
            <select class="form-control" id="playerId" name="playerId" required>
                <option value="">Select Player</option>
            </select>
        </div>

        <div class="form-group">
            <label for="points">Points Scored:</label>
            <input type="number" class="form-control" id="points" name="points" required min="0" max="5">
            <small class="form-text text-muted">Enter points scored in the current set</small>
        </div>

        <div class="form-group">
            <label for="assists">Assists:</label>
            <input type="number" class="form-control" id="assists" name="assists" required min="0">
        </div>

        <div class="form-group">
            <label for="blocks">Blocks:</label>
            <input type="number" class="form-control" id="blocks" name="blocks" required min="0">
        </div>

        <div class="form-group">
            <label for="servings">Service Points:</label>
            <input type="number" class="form-control" id="servings" name="servings" required min="0">
        </div>

        <button type="submit" class="btn btn-primary">Update Score</button>
    </form>
</div>

<script src="https://code.jquery.com/jquery-3.2.1.slim.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.11.0/umd/popper.min.js"></script>
<script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/js/bootstrap.min.js"></script>

<script th:inline="javascript">
    const players = /*[[${dtoPlayers}]]*/ [];
    
    document.addEventListener("DOMContentLoaded", function() {
        const teamSelect = document.getElementById("teamId");
        const playerSelect = document.getElementById("playerId");
        
        function updatePlayerOptions() {
            const selectedTeamId = teamSelect.value;
            playerSelect.innerHTML = '<option value="">Select Player</option>';
            
            players.forEach(player => {
                if (player.teamId == selectedTeamId) {
                    const option = document.createElement("option");
                    option.value = player.volleyball_player_id;
                    option.text = player.name + ' ' + player.surname;
                    playerSelect.add(option);
                }
            });
        }
        
        teamSelect.addEventListener("change", updatePlayerOptions);
    });
</script>
</body>
</html>
