<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Edit Volleyball Player</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script>
        (function () {
            'use strict';
            window.addEventListener('load', function () {
                var forms = document.getElementsByClassName('needs-validation');
                Array.prototype.filter.call(forms, function (form) {
                    form.addEventListener('submit', function (event) {
                        var indexField = document.getElementById('playerIndex');
                        var birthdateField = document.getElementById('playerBirthDate');
                        var currentDate = new Date();
                        var birthDate = new Date(birthdateField.value);

                        // Validate Index Length
                        if (indexField.value.length !== 6) {
                            indexField.setCustomValidity('The index must be exactly 6 digits long.');
                            event.preventDefault();
                            event.stopPropagation();
                        } else {
                            indexField.setCustomValidity('');
                        }

                        // Validate Birth Date
                        if (birthDate > currentDate) {
                            birthdateField.setCustomValidity('The birth date cannot be in the future.');
                            event.preventDefault();
                            event.stopPropagation();
                        } else {
                            birthdateField.setCustomValidity('');
                        }

                        if (form.checkValidity() === false) {
                            event.preventDefault();
                            event.stopPropagation();
                        }
                        form.classList.add('was-validated');
                    }, false);
                });
            }, false);
        })();

        function checkTeamPlayerCount() {
            const teamSelect = document.getElementById('teamSelect');
            const selectedTeam = teamSelect.options[teamSelect.selectedIndex];
            const playerCount = selectedTeam.getAttribute('data-player-count');
            const submitButton = document.getElementById('submitButton');

            if (parseInt(playerCount) >= 6) {
                alert('This team already has 6 players. You cannot add more.');
                submitButton.disabled = true;
            } else {
                submitButton.disabled = false;
            }
        }

        function calculatePricePreview() {
            const appearances = parseInt(document.getElementById('appearances').value) || 0;
            const servings = parseInt(document.getElementById('servings').value) || 0;
            const assists = parseInt(document.getElementById('assists').value) || 0;
            const scoredPoints = parseInt(document.getElementById('scoredPoints').value) || 0;
            const blocks = parseInt(document.getElementById('blocks').value) || 0;
            const position = document.getElementById('playerPosition').value;
            
            let calculatedPrice = 5.0; // Base price
            
            // Scored points are highly valuable
            calculatedPrice += scoredPoints * 1.5;
            
            // Assists show playmaking ability
            calculatedPrice += assists * 1.0;
            
            // Blocks show defensive prowess
            calculatedPrice += blocks * 1.2;
            
            // Servings show serving ability
            calculatedPrice += servings * 0.8;
            
            // Appearances show consistency
            calculatedPrice += appearances * 0.1;
            
            // Position-based adjustments
            if (position === 'S') {
                calculatedPrice += assists * 0.5;
            } else if (position === 'OH' || position === 'OPP') {
                calculatedPrice += scoredPoints * 0.3;
            } else if (position === 'MB') {
                calculatedPrice += blocks * 0.5;
            } else if (position === 'L' || position === 'DS') {
                calculatedPrice += appearances * 0.2;
            }
            
            // Apply bounds
            calculatedPrice = Math.max(1.0, Math.min(50.0, calculatedPrice));
            
            document.getElementById('priceDisplay').value = calculatedPrice.toFixed(1);
        }

        // Add event listeners to stats fields
        document.addEventListener('DOMContentLoaded', function() {
            const statsFields = ['appearances', 'servings', 'assists', 'scoredPoints', 'blocks', 'playerPosition'];
            statsFields.forEach(fieldId => {
                const field = document.getElementById(fieldId);
                if (field) {
                    field.addEventListener('input', calculatePricePreview);
                    field.addEventListener('change', calculatePricePreview);
                }
            });
            
            // Initial calculation
            calculatePricePreview();
        });
    </script>

</head>
<body>
<header class="bg-primary text-white p-3">
    <div class="container">
        <h1 class="mb-0">Edit Volleyball Player</h1>
    </div>
</header>
<div class="container mt-5">
    <form th:action="@{/volleyball/players/edit/{id}(id=${player.getVolleyball_player_id()})}" th:method="post" enctype="multipart/form-data" onsubmit="return validateForm()">
        <div class="form-group">
            <label for="image">Image</label>
            <input type="file" class="form-control-file" id="image" name="image">
        </div>
        <div class="form-group">
            <label for="name">Name</label>
            <input type="text" class="form-control" id="name" name="name" th:value="${player.name}" required>
        </div>
        <div class="form-group">
            <label for="surname">Surname</label>
            <input type="text" class="form-control" id="surname" name="surname" th:value="${player.surname}" required>
        </div>
        <div class="form-group">
            <label for="birthdate">Birthdate</label>
            <input type="date" class="form-control" id="birthdate" name="birthdate" th:value="${#dates.format(player.birthdate, 'yyyy-MM-dd')}" required>
        </div>
        <div class="form-group">
            <label for="index">Index</label>
            <input type="number" class="form-control" id="index" name="index" th:value="${player.index}" required>
        </div>
        <div class="form-group">
            <label for="city">City</label>
            <input type="text" class="form-control" id="city" name="city" th:value="${player.city}" required>
        </div>
        <div class="mb-3">
            <label for="playerPosition" class="form-label">Position</label>
            <select class="form-select" id="playerPosition" name="playerPosition" required>
                <option value="" disabled selected>Select Position</option>
                <option th:value="'S'" th:selected="${player != null && player.getPosition() == 'S'}">Setter (S)</option>
                <option th:value="'OH'" th:selected="${player != null && player.getPosition() == 'OH'}">Outside Hitter (OH)</option>
                <option th:value="'MB'" th:selected="${player != null && player.getPosition() == 'MB'}">Middle Blocker (MB)</option>
                <option th:value="'OPP'" th:selected="${player != null && player.getPosition() == 'OPP'}">Opposite (OPP)</option>
                <option th:value="'L'" th:selected="${player != null && player.getPosition() == 'L'}">Libero (L)</option>
                <option th:value="'DS'" th:selected="${player != null && player.getPosition() == 'DS'}">Defensive Specialist (DS)</option>
            </select>
            <div class="invalid-feedback">Please select the player's position.</div>
        </div>

        <div class="form-group">
            <label>Team</label>
            <select class="form-control" id="teamSelect" name="teamId" required onchange="checkTeamPlayerCount()">
                <option th:each="team : ${teams}"
                        th:value="${team.getVolleyball_team_id()}"
                        th:text="${team.teamName}"
                        th:attr="data-player-count=${team.getPlayers().size()}"
                        th:selected="${team.getVolleyball_team_id() == player.getTeam().getVolleyball_team_id()}">
                </option>
            </select>
        </div>

        <!-- Player Stats Section -->
        <div class="row mb-4">
            <div class="col-12">
                <h3 class="text-primary" style="margin-bottom: 20px;">
                    📊 Player Statistics
                </h3>
            </div>
        </div>

        <!-- Appearances -->
        <div class="form-group">
            <label for="appearances" class="form-label">🏐 Appearances</label>
            <input type="number" class="form-control" id="appearances" name="appearances"
                   th:value="${player != null ? player.getAppearances() : 0}" min="0" placeholder="Number of appearances">
        </div>

        <!-- Servings -->
        <div class="form-group">
            <label for="servings" class="form-label">🎯 Servings</label>
            <input type="number" class="form-control" id="servings" name="servings"
                   th:value="${player != null ? player.getServings() : 0}" min="0" placeholder="Number of servings">
        </div>

        <!-- Assists -->
        <div class="form-group">
            <label for="assists" class="form-label">🅰️ Assists</label>
            <input type="number" class="form-control" id="assists" name="assists"
                   th:value="${player != null ? player.getAssists() : 0}" min="0" placeholder="Number of assists">
        </div>

        <!-- Scored Points -->
        <div class="form-group">
            <label for="scoredPoints" class="form-label">🏆 Scored Points</label>
            <input type="number" class="form-control" id="scoredPoints" name="scoredPoints"
                   th:value="${player != null ? player.getScoredPoints() : 0}" min="0" placeholder="Number of scored points">
        </div>

        <!-- Blocks -->
        <div class="form-group">
            <label for="blocks" class="form-label">🛡️ Blocks</label>
            <input type="number" class="form-control" id="blocks" name="blocks"
                   th:value="${player != null ? player.getBlocks() : 0}" min="0" placeholder="Number of blocks">
        </div>

        <!-- Price Display (Read-only) -->
        <div class="form-group">
            <label for="priceDisplay" class="form-label">💰 Current Price</label>
            <input type="text" class="form-control" id="priceDisplay" readonly
                   th:value="${player != null ? player.getPrice() : 5.0}" placeholder="Price calculated automatically">
            <small class="form-text text-muted">Price is calculated automatically based on player statistics</small>
        </div>
        <button type="submit" id="submitButton" class="btn btn-primary">Save Changes</button>
        <a class="btn btn-secondary" th:href="@{/volleyball/players}">Cancel</a>
    </form>
</div>
</body>
</html>
