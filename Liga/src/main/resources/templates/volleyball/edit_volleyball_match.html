<header class="premium-header text-white">
    <div class="container">
        <h1 class="mb-0">🏐 Edit Volleyball Match</h1>
    </div>
</header>

<section class="premium-container section-spacing">
    <div class="row mb-5">
        <div class="col-12">
            <h2 class="page-title">🏆 Update Match Information</h2>
            <p class="text-premium-light" style="font-size: var(--text-lg);">Edit volleyball match details and set scores</p>
        </div>
    </div>
    
    <form th:action="@{/volleyball/matches/edit}" method="post" onsubmit="return validateForm()" class="needs-validation" novalidate>
        <input type="hidden" name="id" th:value="${match.getVolleyball_match_id()}">
        <input type="hidden" name="homeTeamPoints" id="homeTeamPoints" th:value="${match.homeTeamPoints}">
        <input type="hidden" name="awayTeamPoints" id="awayTeamPoints" th:value="${match.awayTeamPoints}">

        <div class="premium-card mb-4">
            <div class="form-group-premium">
                <label for="homeTeam" class="form-label-premium">🏠 Home Team</label>
                <select id="homeTeam" name="homeTeamId" class="form-control-premium" required>
                    <option value="" disabled>Select Home Team</option>
                    <option th:each="team : ${teams}" th:value="${team.getVolleyball_team_id()}" th:text="${team.getTeamName()}"
                            th:selected="${team.getVolleyball_team_id() == match.homeTeam.getVolleyball_team_id()}">Team Name</option>
                </select>
                <div class="invalid-feedback">Please select the home team.</div>
            </div>

            <div class="form-group-premium">
                <label for="awayTeam" class="form-label-premium">✈️ Away Team</label>
                <select id="awayTeam" name="awayTeamId" class="form-control-premium" required>
                    <option value="" disabled>Select Away Team</option>
                    <option th:each="team : ${teams}" th:value="${team.getVolleyball_team_id()}" th:text="${team.getTeamName()}"
                            th:selected="${team.getVolleyball_team_id() == match.awayTeam.getVolleyball_team_id()}">Team Name</option>
                </select>
                <div class="invalid-feedback">Please select the away team.</div>
            </div>
        </div>

        <div class="premium-card mb-4">
            <h3 class="text-premium mb-4" style="color: var(--accent-blue);">🏐 Set Scores</h3>
            <div class="row">
                <div class="col-md-6">
                    <h4 class="text-premium mb-4" style="color: var(--accent-blue);" th:text="${match.homeTeam.teamName}">Home Team Sets</h4>
                    <div class="form-group-premium">
                        <label for="homeTeamSet1Points" class="form-label-premium">Set 1</label>
                        <input type="number" id="homeTeamSet1Points" name="homeTeamSet1Points" class="form-control-premium set-points" 
                               th:value="${match.homeTeamSet1Points}" min="0" max="25" required placeholder="Enter Set 1 points">
                    </div>
                    <div class="form-group-premium">
                        <label for="homeTeamSet2Points" class="form-label-premium">Set 2</label>
                        <input type="number" id="homeTeamSet2Points" name="homeTeamSet2Points" class="form-control-premium set-points" 
                               th:value="${match.homeTeamSet2Points}" min="0" max="25" required placeholder="Enter Set 2 points">
                    </div>
                    <div class="form-group-premium">
                        <label for="homeTeamSet3Points" class="form-label-premium">Set 3</label>
                        <input type="number" id="homeTeamSet3Points" name="homeTeamSet3Points" class="form-control-premium set-points" 
                               th:value="${match.homeTeamSet3Points}" min="0" max="25" required placeholder="Enter Set 3 points">
                    </div>
                    <div class="form-group-premium">
                        <label for="homeTeamSet4Points" class="form-label-premium">Set 4</label>
                        <input type="number" id="homeTeamSet4Points" name="homeTeamSet4Points" class="form-control-premium set-points" 
                               th:value="${match.homeTeamSet4Points}" min="0" max="25" placeholder="Enter Set 4 points">
                    </div>
                    <div class="form-group-premium">
                        <label for="homeTeamSet5Points" class="form-label-premium">Set 5</label>
                        <input type="number" id="homeTeamSet5Points" name="homeTeamSet5Points" class="form-control-premium set-points" 
                               th:value="${match.homeTeamSet5Points}" min="0" max="15" placeholder="Enter Set 5 points">
                    </div>
                </div>
                <div class="col-md-6">
                    <h4 class="text-premium mb-4" style="color: var(--accent-blue);" th:text="${match.awayTeam.teamName}">Away Team Sets</h4>
                    <div class="form-group-premium">
                        <label for="awayTeamSet1Points" class="form-label-premium">Set 1</label>
                        <input type="number" id="awayTeamSet1Points" name="awayTeamSet1Points" class="form-control-premium set-points" 
                               th:value="${match.awayTeamSet1Points}" min="0" max="25" required placeholder="Enter Set 1 points">
                    </div>
                    <div class="form-group-premium">
                        <label for="awayTeamSet2Points" class="form-label-premium">Set 2</label>
                        <input type="number" id="awayTeamSet2Points" name="awayTeamSet2Points" class="form-control-premium set-points" 
                               th:value="${match.awayTeamSet2Points}" min="0" max="25" required placeholder="Enter Set 2 points">
                    </div>
                    <div class="form-group-premium">
                        <label for="awayTeamSet3Points" class="form-label-premium">Set 3</label>
                        <input type="number" id="awayTeamSet3Points" name="awayTeamSet3Points" class="form-control-premium set-points" 
                               th:value="${match.awayTeamSet3Points}" min="0" max="25" required placeholder="Enter Set 3 points">
                    </div>
                    <div class="form-group-premium">
                        <label for="awayTeamSet4Points" class="form-label-premium">Set 4</label>
                        <input type="number" id="awayTeamSet4Points" name="awayTeamSet4Points" class="form-control-premium set-points" 
                               th:value="${match.awayTeamSet4Points}" min="0" max="25" placeholder="Enter Set 4 points">
                    </div>
                    <div class="form-group-premium">
                        <label for="awayTeamSet5Points" class="form-label-premium">Set 5</label>
                        <input type="number" id="awayTeamSet5Points" name="awayTeamSet5Points" class="form-control-premium set-points" 
                               th:value="${match.awayTeamSet5Points}" min="0" max="15" placeholder="Enter Set 5 points">
                    </div>
                </div>
            </div>
        </div>

        <div class="row">
            <div class="col-md-6">
                <div class="form-group-premium">
                    <label for="startTime" class="form-label-premium">⏰ Start Time</label>
                    <input type="datetime-local" id="startTime" name="startTime" class="form-control-premium" 
                           th:value="${#temporals.format(match.startTime, 'yyyy-MM-dd''T''HH:mm')}" required>
                    <div class="invalid-feedback">Please select the start time.</div>
                </div>
            </div>
            <div class="col-md-6">
                <div class="form-group-premium">
                    <label for="endTime" class="form-label-premium">⏰ End Time</label>
                    <input type="datetime-local" id="endTime" name="endTime" class="form-control-premium"  
                           th:value="${#temporals.format(match.endTime, 'yyyy-MM-dd''T''HH:mm')}" required>
                    <div class="invalid-feedback">Please select the end time.</div>
                </div>
            </div>
        </div>

        <div class="d-flex gap-3 mt-4">
            <button type="submit" class="btn-premium">💾 Update Match</button>
            <a th:href="@{/volleyball/matches/details/{id}(id=${match.getVolleyball_match_id()})}" class="btn-premium" style="background: var(--gray-600);">⬅️ Back to Match Details</a>
        </div>
    </form>
</section>

<script>
    function calculateTotalPoints() {
        let homeSetsWon = 0;
        let awaySetsWon = 0;

        for (let i = 1; i <= 5; i++) {
            const homeSetPoints = parseInt(document.getElementById(`homeTeamSet${i}Points`).value) || 0;
            const awaySetPoints = parseInt(document.getElementById(`awayTeamSet${i}Points`).value) || 0;

            const minToWin = (i === 5) ? 15 : 25;
            if (homeSetPoints >= minToWin || awaySetPoints >= minToWin) {
                if (homeSetPoints >= minToWin && (homeSetPoints - awaySetPoints) >= 2) {
                    homeSetsWon++;
                } else if (awaySetPoints >= minToWin && (awaySetPoints - homeSetPoints) >= 2) {
                    awaySetsWon++;
                }
            }
        }

        document.getElementById('homeTeamPoints').value = homeSetsWon;
        document.getElementById('awayTeamPoints').value = awaySetsWon;
    }

    function validateForm() {
        const homeTeam = document.getElementById('homeTeam').value;
        const awayTeam = document.getElementById('awayTeam').value;
        const startTime = document.getElementById('startTime').value;
        const endTime = document.getElementById('endTime').value;

        // Check if home and away teams are the same
        if (homeTeam === awayTeam) {
            alert("Home and Away teams cannot be the same.");
            return false;
        }

        // Check if end time is before start time
        if (new Date(endTime) < new Date(startTime)) {
            alert("End time cannot be before start time.");
            return false;
        }

        // Validate set scores (max thresholds per set)
        for (let i = 1; i <= 5; i++) {
            const homePoints = parseInt(document.getElementById(`homeTeamSet${i}Points`).value) || 0;
            const awayPoints = parseInt(document.getElementById(`awayTeamSet${i}Points`).value) || 0;
            
            if (i < 5) {
                if (homePoints > 25 || awayPoints > 25) {
                    alert(`Set ${i}: Points cannot exceed 25.`);
                    return false;
                }
            } else {
                if (homePoints > 15 || awayPoints > 15) {
                    alert("Set 5: Points cannot exceed 15.");
                    return false;
                }
            }
        }

        // Calculate total points before submitting
        calculateTotalPoints();
        return true;
    }

    // Add event listeners to update total points when set scores change
    document.addEventListener('DOMContentLoaded', function() {
        const setInputs = document.querySelectorAll('.set-points');
        setInputs.forEach(input => {
            input.addEventListener('change', calculateTotalPoints);
        });
        
        // Calculate initial points
        calculateTotalPoints();
    });
</script>

</body>
</html>
