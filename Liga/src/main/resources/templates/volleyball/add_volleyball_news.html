<header class="premium-header text-white">
    <div class="container">
        <h1 class="mb-0">📝 Add Volleyball News</h1>
    </div>
</header>

<section class="premium-container section-spacing">
    <div class="row mb-5">
        <div class="col-12">
            <h2 class="page-title">🏐 Create New News Article</h2>
            <p class="text-premium-light" style="font-size: var(--text-lg);">Share the latest volleyball news and updates</p>
        </div>
    </div>
    
    <form action="#" th:action="@{/volleyball/news/add}" th:object="${news}" method="post" class="needs-validation" novalidate>
        <!-- Title -->
        <div class="form-group-premium">
            <label for="title" class="form-label-premium">📰 News Title</label>
            <input type="text" class="form-control-premium" id="title" name="title"
                   th:value="${news != null} ? ${news.title} : ''" required placeholder="Enter news title">
            <div class="invalid-feedback">Please enter the news title.</div>
        </div>

        <!-- Content -->
        <div class="form-group-premium">
            <label for="content" class="form-label-premium">📄 News Content</label>
            <textarea class="form-control-premium" id="content" name="content" rows="8"
                      th:value="${news != null} ? ${news.content} : ''" required placeholder="Enter news content"></textarea>
            <div class="invalid-feedback">Please enter the news content.</div>
        </div>

        <!-- Submit and Back Buttons -->
        <div class="d-flex gap-3 mt-4">
            <button type="submit" class="btn-premium">📝 Add News</button>
            <a type="button" class="btn-premium" href="/volleyball/news" style="background: var(--gray-600);">⬅️ Back to News List</a>
        </div>
    </form>
</section>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<!-- Custom Script for Validation -->
<script>
    (function () {
        'use strict';
        window.addEventListener('load', function () {
            var forms = document.getElementsByClassName('needs-validation');
            Array.prototype.filter.call(forms, function (form) {
                form.addEventListener('submit', function (event) {
                    if (form.checkValidity() === false) {
                        event.preventDefault();
                        event.stopPropagation();
                    }
                    form.classList.add('was-validated');
                }, false);
            });
        }, false);
    })();
</script>

</body>
</html>
