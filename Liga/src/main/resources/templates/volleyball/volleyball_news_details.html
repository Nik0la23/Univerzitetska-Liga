<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Volleyball News Details</title>
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/css/bootstrap.min.css">
    <link rel="stylesheet" href="/css/premium-design-system.css">
    <style>
        .premium-header {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            border-bottom: 3px solid #3282b8;
            box-shadow: 0 8px 32px rgba(50,130,184,0.3);
            position: relative;
            overflow: hidden;
        }
        
        .premium-header::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><circle cx="25" cy="25" r="3" fill="rgba(50,130,184,0.1)"/><circle cx="75" cy="75" r="2" fill="rgba(50,130,184,0.1)"/><circle cx="50" cy="10" r="1" fill="rgba(50,130,184,0.1)"/></svg>');
            animation: floatPattern 25s infinite linear;
        }
        
        @keyframes floatPattern {
            0% { transform: translateX(-100px) translateY(0); }
            50% { transform: translateX(100px) translateY(-20px); }
            100% { transform: translateX(-100px) translateY(0); }
        }
        
        .premium-header h1 {
            font-family: 'Montserrat', sans-serif;
            font-weight: 800;
            font-size: 2.8rem;
            color: #fff;
            text-shadow: 0 0 15px rgba(50,130,184,0.6);
            margin: 0;
            position: relative;
            z-index: 1;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        @media (max-width: 768px) {
            .premium-header h1 {
                font-size: 2rem;
            }
        }
        
        .news-meta {
            background: linear-gradient(135deg, #f0f8ff, #e6f3ff);
            border-left: 4px solid #3282b8;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 30px;
        }
        
        .news-content {
            background: #fff;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            border: 1px solid #e9ecef;
            line-height: 1.8;
            font-size: 1.1rem;
        }
    </style>
</head>
<body>

<header class="premium-header text-white">
    <div class="container">
        <h1 class="mb-0">🏐 <span th:text="${news.title}">News Title</span></h1>
    </div>
</header>

<section class="premium-container section-spacing">
    <div class="row mb-5">
        <div class="col-12 text-center">
            <h2 class="page-title">
                📰 News Article
            </h2>
        </div>
    </div>
    
    <div class="news-meta">
        <div class="row align-items-center">
            <div class="col-md-8">
                <h4 class="text-premium mb-2" style="color: #3282b8;">📅 Published Date</h4>
                <p class="text-readable mb-0" style="font-size: 1.1rem; font-weight: 500;">
                    <span th:text="${#temporals.format(news.publishedDate, 'EEEE, MMMM dd, yyyy')}">Date</span>
                </p>
            </div>
            <div class="col-md-4 text-md-right">
                <span class="badge badge-info" style="background: #3282b8; padding: 8px 16px; font-size: 0.9rem;">🏐 Volleyball News</span>
            </div>
        </div>
    </div>

    <div class="news-content">
        <h3 class="text-premium mb-4" style="color: #3282b8;">📖 Article Content</h3>
        <div class="text-readable" style="font-size: 1.1rem; line-height: 1.8;" th:text="${news.content}">
            News Content
        </div>
    </div>
    
    <div class="d-flex gap-3 justify-content-center mt-5 flex-wrap">
        <a th:href="@{/volleyball/news/edit/{id}(id=${news.news_id})}" class="btn-premium btn-warning">✏️ Edit Article</a>
        <a th:href="@{/news}" class="btn-premium btn-secondary">📰 All Sports News</a>
        <a th:href="@{/football/news}" class="btn-premium" style="background: var(--accent-green);">⚽ Football News</a>
        <a th:href="@{/basketball/news}" class="btn-premium" style="background: var(--accent-orange);">🏀 Basketball News</a>
        <a th:href="@{/volleyball/news}" class="btn-premium" style="background: var(--accent-blue);">🏐 Volleyball News</a>
    </div>
</section>

<script src="https://code.jquery.com/jquery-3.2.1.slim.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.11.0/umd/popper.min.js"></script>
<script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/js/bootstrap.min.js"></script>
</body>
</html>
