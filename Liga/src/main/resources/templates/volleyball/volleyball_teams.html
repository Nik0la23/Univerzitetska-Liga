<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Volleyball Teams</title>
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/css/bootstrap.min.css">
    <link rel="stylesheet" href="/css/premium-design-system.css">
    <style>
        .premium-header {
            background: linear-gradient(135deg, #0f4c75 0%, #3282b8 50%, #0f4c75 100%);
            border-bottom: 4px solid #bbe1fa;
            box-shadow: 0 8px 32px rgba(11,76,117,0.4);
            position: relative;
            overflow: hidden;
        }
        
        .premium-header::after {
            content: '';
            position: absolute;
            top: -30%;
            left: -20%;
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, rgba(187,225,250,0.2) 0%, transparent 70%);
            border-radius: 50%;
            animation: volleyballBounce 4s infinite;
        }
        
        @keyframes volleyballBounce {
            0%, 100% { transform: translateY(0) scale(1); }
            25% { transform: translateY(-30px) scale(1.1); }
            50% { transform: translateY(0) scale(1); }
            75% { transform: translateY(-15px) scale(1.05); }
        }
        
        .premium-header h1 {
            font-family: 'Montserrat', sans-serif;
            font-weight: 800;
            font-size: 3.2rem;
            color: #fff;
            text-shadow: 0 0 25px rgba(187,225,250,0.6);
            margin: 0;
            position: relative;
            z-index: 2;
            text-transform: uppercase;
            letter-spacing: 3px;
        }
        
        @media (max-width: 768px) {
            .premium-header h1 {
                font-size: 2.2rem;
            }
        }
    </style>
</head>
<body>

<header class="premium-header text-white">
    <div class="container">
        <h1 class="mb-0">🏐 Volleyball Teams</h1>
    </div>
</header>

<section class="premium-container">
    <div class="row mb-4">
        <div class="col-12">
            <h2 class="text-premium" style="color: #3282b8; font-size: var(--text-2xl); margin-bottom: var(--space-6);">
                🏐 All Volleyball Teams
            </h2>
        </div>
    </div>
    
    <div class="text-center mb-4">
        <a th:href="@{/volleyball/teams/add-form}" class="btn btn-premium btn-success">➕ Add New Team</a>
    </div>
    
    <div class="table-responsive">
        <table class="table-premium">
            <thead>
            <tr>
                <th>🏐 Team Logo</th>
                <th>👥 Team Name</th>
                <th>👁️ Details</th>
                <th>✏️ Edit</th>
                <th>🗑️ Delete</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="team : ${volleyballTeams}">
                <td>
                    <img th:src="@{/volleyball/teams/logo/{id}(id=${team.getVolleyball_team_id})}" 
                         alt="Team Image" 
                         style="width:60px;height:60px;border-radius:50%;object-fit:cover;border:2px solid #3282b8;"/>
                </td>
                <td class="text-premium" th:text="${team.teamName}"></td>
                <td>
                    <a th:href="@{/volleyball/teams/team/{id}(id=${team.getVolleyball_team_id})}" class="btn btn-premium btn-primary" style="padding: var(--space-2) var(--space-3); font-size: var(--text-xs);">👁️ Details</a>
                </td>
                <td>
                    <a th:href="@{/volleyball/teams/edit/{id}(id=${team.getVolleyball_team_id})}" class="btn btn-premium btn-warning" style="padding: var(--space-2) var(--space-3); font-size: var(--text-xs);">✏️ Edit</a>
                </td>
                <td>
                    <form th:method="POST" th:action="@{'/volleyball/teams/delete/{id}'(id=${team.getVolleyball_team_id})}" style="display:inline;">
                        <button type="submit" class="btn btn-premium btn-danger" style="padding: var(--space-2) var(--space-3); font-size: var(--text-xs);">🗑️ Delete</button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</section>

<script src="https://code.jquery.com/jquery-3.2.1.slim.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.11.0/umd/popper.min.js"></script>
<script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/js/bootstrap.min.js"></script>
</body>
</html>
