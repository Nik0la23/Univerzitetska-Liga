<header xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.w3.org/1999/xhtml">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800&family=Inter:wght@300;400;500;600&display=swap');
        
        .premium-navbar {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            border-bottom: 3px solid #e94560;
            box-shadow: 0 8px 32px rgba(0,0,0,0.3);
            position: relative;
            overflow: hidden;
            padding: 15px 0;
        }
        
        .premium-navbar::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><circle cx="20" cy="20" r="2" fill="rgba(255,255,255,0.1)"/><circle cx="80" cy="80" r="2" fill="rgba(255,255,255,0.1)"/><circle cx="40" cy="60" r="1" fill="rgba(255,255,255,0.1)"/></svg>');
            animation: headerFloat 20s infinite linear;
        }
        
        @keyframes headerFloat {
            0% { transform: translateX(-100px); }
            100% { transform: translateX(100px); }
        }
        
        .premium-brand {
            font-family: 'Montserrat', sans-serif;
            font-weight: 800;
            font-size: 1.8rem;
            color: #fff;
            text-shadow: 0 0 20px rgba(233,69,96,0.6);
            text-decoration: none;
            letter-spacing: 2px;
            position: relative;
            z-index: 2;
            transition: all 0.3s ease;
        }
        
        .premium-brand:hover {
            color: #e94560;
            text-shadow: 0 0 30px rgba(233,69,96,0.8);
            transform: scale(1.05);
        }
        
        .premium-nav-links {
            position: relative;
            z-index: 2;
        }
        
        .premium-nav-links .nav-link {
            color: rgba(255,255,255,0.9) !important;
            font-family: 'Inter', sans-serif;
            font-weight: 500;
            font-size: 0.95rem;
            padding: 12px 20px !important;
            margin: 0 5px;
            border-radius: 25px;
            transition: all 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            position: relative;
            overflow: hidden;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        .premium-nav-links .nav-link::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(233,69,96,0.3), transparent);
            transition: left 0.5s ease;
        }
        
        .premium-nav-links .nav-link:hover::before {
            left: 100%;
        }
        
        .premium-nav-links .nav-link:hover {
            background: linear-gradient(135deg, #e94560, #ff6b9d);
            color: white !important;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(233,69,96,0.4);
        }
        
        .premium-nav-links .nav-link.active {
            background: linear-gradient(135deg, rgba(233,69,96,0.3), rgba(255,107,157,0.2));
            color: #fff !important;
            box-shadow: 0 4px 15px rgba(233,69,96,0.3);
        }
        
        .premium-auth-links {
            position: relative;
            z-index: 2;
        }
        
        .premium-auth-links .nav-link {
            color: rgba(255,255,255,0.8) !important;
            font-family: 'Inter', sans-serif;
            font-weight: 500;
            padding: 10px 18px !important;
            margin: 0 3px;
            border-radius: 20px;
            transition: all 0.3s ease;
            border: 1px solid rgba(255,255,255,0.2);
        }
        
        .premium-auth-links .nav-link:hover {
            background: linear-gradient(135deg, #e94560, #ff6b9d);
            color: white !important;
            border-color: #e94560;
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(233,69,96,0.3);
        }
        
        .premium-dropdown {
            background: rgba(26,26,46,0.95);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(233,69,96,0.3);
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            margin-top: 10px;
        }
        
        .premium-dropdown .dropdown-item {
            color: rgba(255,255,255,0.9);
            padding: 12px 20px;
            transition: all 0.3s ease;
            border-radius: 8px;
            margin: 5px;
        }
        
        .premium-dropdown .dropdown-item:hover {
            background: linear-gradient(135deg, #e94560, #ff6b9d);
            color: white;
            transform: translateX(5px);
        }
        
        .premium-toggler {
            border: 2px solid rgba(255,255,255,0.3);
            border-radius: 8px;
            padding: 8px;
            transition: all 0.3s ease;
        }
        
        .premium-toggler:hover {
            border-color: #e94560;
            background: rgba(233,69,96,0.1);
        }
        
        .premium-toggler .navbar-toggler-icon {
            background-image: url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 30 30'%3e%3cpath stroke='rgba%28255, 255, 255, 0.8%29' stroke-linecap='round' stroke-miterlimit='10' stroke-width='2' d='M4 7h22M4 15h22M4 23h22'/%3e%3c/svg%3e");
        }
        
        @media (max-width: 768px) {
            .premium-brand {
                font-size: 1.4rem;
            }
            
            .premium-nav-links .nav-link {
                padding: 10px 15px !important;
                margin: 2px;
                font-size: 0.9rem;
            }
        }
    </style>
    
    <nav class="navbar navbar-expand-md premium-navbar">
        <div class="container">
            <a class="premium-brand" href="/">🏆 UNIVERSITY LEAGUE</a>
            <button class="navbar-toggler premium-toggler" type="button" data-toggle="collapse" data-target="#navbarsExampleDefault"
                    aria-controls="navbarsExampleDefault" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse justify-content-end" id="navbarsExampleDefault" xmlns:th="http://www.thymeleaf.org">
                <ul class="navbar-nav m-auto premium-nav-links">
                    <li class="nav-item">
                        <a class="nav-link active" href="/players">👥 Players</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="/teams">🏆 Teams</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="/matches">⚽ Matches</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="/fantasy/football">🎮 Fantasy</a>
                    </li>
                </ul>
                <ul class="navbar-nav premium-auth-links">
                    <li class="nav-item" th:if="${session.user == null}">
                        <a class="nav-link" href="/auth/login">🔑 Login</a>
                    </li>
                    <li class="nav-item" th:if="${session.user == null}">
                        <a class="nav-link" href="/auth/register">📝 Register</a>
                    </li>
                    <li class="nav-item" th:if="${session.user != null}">
                        <a class="nav-link" href="/auth/logout">🚪 Logout</a>
                    </li>
                    <li class="nav-item dropdown" th:if="${session.user != null}">
                        <a class="nav-link dropdown-toggle" href="#" id="userMenu" role="button" data-toggle="dropdown" aria-haspopup="true" aria-expanded="false" th:text="${session.user.name}">User</a>
                        <div class="dropdown-menu dropdown-menu-right premium-dropdown" aria-labelledby="userMenu">
                            <form th:action="@{/auth/logout}" method="post" class="px-3 py-2">
                                <button type="submit" class="btn btn-link p-0 text-white">🚪 Logout</button>
                            </form>
                        </div>
                    </li>
                </ul>
            </div>
        </div>
    </nav>
</header>
