<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Football News Details</title>
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/css/bootstrap.min.css">
    <link rel="stylesheet" href="/css/premium-design-system.css">
    <style>
        .premium-header {
            background: linear-gradient(135deg, #1a1a1a 0%, #2d4a3a 100%);
            border-bottom: 3px solid #4CAF50;
            box-shadow: 0 8px 32px rgba(0,0,0,0.3);
            position: relative;
            overflow: hidden;
        }
        
        .premium-header::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><circle cx="20" cy="20" r="2" fill="rgba(255,255,255,0.1)"/><circle cx="80" cy="80" r="2" fill="rgba(255,255,255,0.1)"/><circle cx="40" cy="60" r="1" fill="rgba(255,255,255,0.1)"/></svg>');
            animation: floatPattern 20s infinite linear;
        }
        
        @keyframes floatPattern {
            0% { transform: translateX(-100px); }
            100% { transform: translateX(100px); }
        }
        
        .premium-header h1 {
            font-family: 'Playfair Display', serif;
            font-weight: 700;
            font-size: 2.8rem;
            color: #fff;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
            margin: 0;
            position: relative;
            z-index: 1;
        }
        
        @media (max-width: 768px) {
            .premium-header h1 {
                font-size: 2rem;
            }
        }
        
        .news-meta {
            background: linear-gradient(135deg, #f8f9fa, #e9ecef);
            border-left: 4px solid #4CAF50;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 30px;
        }
        
        .news-content {
            background: #fff;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            border: 1px solid #e9ecef;
            line-height: 1.8;
            font-size: 1.1rem;
        }
    </style>
</head>
<body>

<header class="premium-header text-white">
    <div class="container">
        <h1 class="mb-0">⚽ <span th:text="${news.title}">News Title</span></h1>
    </div>
</header>

<section class="premium-container section-spacing">
    <div class="row mb-5">
        <div class="col-12 text-center">
            <h2 class="page-title">
                📰 News Article
            </h2>
        </div>
    </div>
    
    <div class="news-meta">
        <div class="row align-items-center">
            <div class="col-md-8">
                <h4 class="text-premium mb-2" style="color: #4CAF50;">📅 Published Date</h4>
                <p class="text-readable mb-0" style="font-size: 1.1rem; font-weight: 500;">
                    <span th:text="${#temporals.format(news.publishedDate, 'EEEE, MMMM dd, yyyy')}">Date</span>
                </p>
            </div>
            <div class="col-md-4 text-md-right">
                <span class="badge badge-success" style="background: #4CAF50; padding: 8px 16px; font-size: 0.9rem;">⚽ Football News</span>
            </div>
        </div>
    </div>

    <div class="news-content">
        <h3 class="text-premium mb-4" style="color: #4CAF50;">📖 Article Content</h3>
        <div class="text-readable" style="font-size: 1.1rem; line-height: 1.8;" th:text="${news.content}">
            News Content
        </div>
    </div>
    
    <div class="d-flex gap-3 justify-content-center mt-5">
        <a th:href="@{/news/edit/{id}(id=${news.news_id})}" class="btn-premium btn-warning">✏️ Edit Article</a>
        <a th:href="@{/news}" class="btn-premium btn-secondary">⬅️ Back to News List</a>
    </div>
</section>

<script src="https://code.jquery.com/jquery-3.2.1.slim.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.11.0/umd/popper.min.js"></script>
<script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/js/bootstrap.min.js"></script>
</body>
</html>
