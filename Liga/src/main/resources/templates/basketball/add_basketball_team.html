<header class="premium-header text-white">
    <div class="container">
        <h1 class="mb-0">🏀 Add Basketball Team</h1>
    </div>
</header>

<section class="premium-container section-spacing">
    <div class="row mb-5">
        <div class="col-12">
            <h2 class="page-title">🏆 Create New Team</h2>
            <p class="text-premium-light" style="font-size: var(--text-lg);">Add a new basketball team to the league</p>
        </div>
    </div>
    
    <form th:action="@{/basketball/teams/add}" method="post" enctype="multipart/form-data" class="needs-validation" novalidate>
        <div class="form-group-premium">
            <label for="teamName" class="form-label-premium">🏆 Team Name</label>
            <input type="text" class="form-control-premium" id="teamName" name="teamName" required placeholder="Enter team name">
            <div class="invalid-feedback">Please enter the team name.</div>
        </div>
        
        <div class="form-group-premium">
            <label for="logo" class="form-label-premium">🖼️ Team Logo</label>
            <input type="file" class="form-control-premium" id="logo" name="logo">
            <div class="invalid-feedback">Please upload a team logo.</div>
        </div>
        
        <div class="d-flex gap-3 mt-4">
            <button type="submit" class="btn-premium">🏀 Add Team</button>
            <a type="button" class="btn-premium" onclick="window.history.back()" style="background: var(--gray-600);">⬅️ Back</a>
        </div>
    </form>
</section>
