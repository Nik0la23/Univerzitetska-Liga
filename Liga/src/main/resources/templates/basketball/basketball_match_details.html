<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Match Details</title>
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/css/bootstrap.min.css">
    <style>
        .match-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        .team-container {
            width: 40%;
        }
        .team-name {
            font-weight: bold;
            font-size: 1.5em;
            margin-bottom: 10px;
        }
        .points {
            font-size: 2em;
            font-weight: bold;
        }
        .players-list {
            list-style-type: none;
            padding: 0;
        }
        .quarters-table {
            width: 100%;
            margin-top: 20px;
            margin-bottom: 20px;
            border-collapse: collapse;
        }
        .quarters-table th, .quarters-table td {
            text-align: center;
            padding: 8px;
            border: 1px solid #ddd;
        }
        .quarters-table th {
            background-color: #f8f9fa;
        }
        .total-score {
            font-weight: bold;
            background-color: #e9ecef;
        }
    </style>
</head>
<body>
<header class="bg-primary text-white p-3">
    <div class="container">
        <h1 class="mb-0">Basketball Match Details</h1>
    </div>
</header>
<div class="container mt-4">
    <div class="match-container">
        <div class="team-container">
            <div class="team-name">
                <a th:href="@{/basketball/teams/team/{id}(id=${match.homeTeam.id})}" th:text="${match.homeTeam.teamName}">Home Team Name</a>
            </div>
            <ul class="players-list">
                <li th:each="player : ${match.homeTeam.players}">
                    <a th:href="@{/basketball/players/details/{id}(id=${player.basketball_player_id})}" th:text="${player.name}">Player Name</a>
                </li>
            </ul>
        </div>
        <div class="points">
            <span th:text="${match.homeTeamPoints}">0</span> - <span th:text="${match.awayTeamPoints}">0</span>
        </div>
        <div class="team-container">
            <div class="team-name">
                <a th:href="@{/basketball/teams/team/{id}(id=${match.awayTeam.id})}" th:text="${match.awayTeam.teamName}">Away Team Name</a>
            </div>
            <ul class="players-list">
                <li th:each="player : ${match.awayTeam.players}">
                    <a th:href="@{/basketball/players/details/{id}(id=${player.basketball_player_id})}" th:text="${player.name}">Player Name</a>
                </li>
            </ul>
        </div>
    </div>

    <table class="quarters-table">
        <thead>
            <tr>
                <th>Team</th>
                <th>Q1</th>
                <th>Q2</th>
                <th>Q3</th>
                <th>Q4</th>
                <th>Total</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td th:text="${match.homeTeam.teamName}">Home Team</td>
                <td th:text="${match.homeTeamQ1Points}">0</td>
                <td th:text="${match.homeTeamQ2Points}">0</td>
                <td th:text="${match.homeTeamQ3Points}">0</td>
                <td th:text="${match.homeTeamQ4Points}">0</td>
                <td class="total-score" th:text="${match.homeTeamPoints}">0</td>
            </tr>
            <tr>
                <td th:text="${match.awayTeam.teamName}">Away Team</td>
                <td th:text="${match.awayTeamQ1Points}">0</td>
                <td th:text="${match.awayTeamQ2Points}">0</td>
                <td th:text="${match.awayTeamQ3Points}">0</td>
                <td th:text="${match.awayTeamQ4Points}">0</td>
                <td class="total-score" th:text="${match.awayTeamPoints}">0</td>
            </tr>
        </tbody>
    </table>

    <a href="/basketball/matches" class="btn btn-secondary">Back to Matches</a>
</div>

<script src="https://code.jquery.com/jquery-3.2.1.slim.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.11.0/umd/popper.min.js"></script>
<script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/js/bootstrap.min.js"></script>
</body>
</html>
