<header class="premium-header text-white">
    <div class="container">
        <h1 class="mb-0">🏀 Basketball Match Details</h1>
    </div>
</header>

<section class="premium-container section-spacing">
    <div class="row mb-5">
        <div class="col-12 text-center">
            <h2 class="page-title">
                🏆 Match Information
            </h2>
        </div>
    </div>
    
    <style>
        .match-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        .team-container {
            width: 40%;
        }
        .team-name {
            font-weight: bold;
            font-size: 1.5em;
            margin-bottom: 10px;
        }
        .points {
            font-size: 2em;
            font-weight: bold;
        }
        .players-list {
            list-style-type: none;
            padding: 0;
        }
        .quarters-table {
            width: 100%;
            margin-top: 20px;
            margin-bottom: 20px;
            border-collapse: collapse;
        }
        .quarters-table th, .quarters-table td {
            text-align: center;
            padding: 8px;
            border: 1px solid #ddd;
        }
        .quarters-table th {
            background-color: #f8f9fa;
        }
        .total-score {
            font-weight: bold;
            background-color: #e9ecef;
        }
    </style>
    
    <!-- Match Teams and Score -->
    <div class="premium-card">
        <div class="row align-items-center">
            <!-- Home Team -->
            <div class="col-md-4 text-center">
                <a th:href="@{/basketball/teams/team/{id}(id=${match.homeTeam.id})}" 
                   class="text-decoration-none">
                    <h3 class="text-premium" style="color: var(--accent-orange); margin-bottom: var(--space-4);" 
                        th:text="${match.homeTeam.teamName}">Home Team</h3>
                </a>
                <div class="premium-card" style="background: var(--gray-50);">
                    <h5 class="text-premium" style="margin-bottom: var(--space-3);">👥 PLAYERS</h5>
                    <div class="row">
                        <div class="col-12" th:each="player : ${match.homeTeam.players}">
                            <a th:href="@{/basketball/players/details/{id}(id=${player.basketball_player_id})}" 
                               class="text-readable text-decoration-none d-block mb-2">
                                • <span th:text="${player.name + ' ' + player.surname}">Player Name</span>
                            </a>
                        </div>
                    </div>
                </div>
            </div>
            
            <!-- Score -->
            <div class="col-md-4 text-center">
                <div class="premium-card" style="background: linear-gradient(135deg, var(--accent-orange), #ff8c00);">
                    <h2 class="text-white" style="font-size: var(--text-5xl); margin: 0;">
                        <span th:text="${match.homeTeamPoints}">0</span> 
                        <span style="color: rgba(255,255,255,0.8);">-</span> 
                        <span th:text="${match.awayTeamPoints}">0</span>
                    </h2>
                    <p class="text-white" style="margin: 0; opacity: 0.9;">FINAL SCORE</p>
                </div>
            </div>
            
            <!-- Away Team -->
            <div class="col-md-4 text-center">
                <a th:href="@{/basketball/teams/team/{id}(id=${match.awayTeam.id})}" 
                   class="text-decoration-none">
                    <h3 class="text-premium" style="color: var(--accent-orange); margin-bottom: var(--space-4);" 
                        th:text="${match.awayTeam.teamName}">Away Team</h3>
                </a>
                <div class="premium-card" style="background: var(--gray-50);">
                    <h5 class="text-premium" style="margin-bottom: var(--space-3);">👥 PLAYERS</h5>
                    <div class="row">
                        <div class="col-12" th:each="player : ${match.awayTeam.players}">
                            <a th:href="@{/basketball/players/details/{id}(id=${player.basketball_player_id})}" 
                               class="text-readable text-decoration-none d-block mb-2">
                                • <span th:text="${player.name + ' ' + player.surname}">Player Name</span>
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <!-- Quarter by Quarter Breakdown -->
    <div class="premium-card">
        <h3 class="section-title">📊 Quarter Breakdown</h3>
        <div class="table-responsive">
            <table class="table-premium">
            </ul>
        </div>
    </div>

    <table class="quarters-table">
        <thead>
            <tr>
                <th>Team</th>
                <th>Q1</th>
                <th>Q2</th>
                <th>Q3</th>
                <th>Q4</th>
                <th>Total</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td th:text="${match.homeTeam.teamName}">Home Team</td>
                <td th:text="${match.homeTeamQ1Points}">0</td>
                <td th:text="${match.homeTeamQ2Points}">0</td>
                <td th:text="${match.homeTeamQ3Points}">0</td>
                <td th:text="${match.homeTeamQ4Points}">0</td>
                <td class="total-score" th:text="${match.homeTeamPoints}">0</td>
            </tr>
            <tr>
                <td th:text="${match.awayTeam.teamName}">Away Team</td>
                <td th:text="${match.awayTeamQ1Points}">0</td>
                <td th:text="${match.awayTeamQ2Points}">0</td>
                <td th:text="${match.awayTeamQ3Points}">0</td>
                <td th:text="${match.awayTeamQ4Points}">0</td>
                <td class="total-score" th:text="${match.awayTeamPoints}">0</td>
            </tr>
        </tbody>
    </table>

    <a href="/basketball/matches" class="btn btn-secondary">Back to Matches</a>
</div>

<script src="https://code.jquery.com/jquery-3.2.1.slim.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.11.0/umd/popper.min.js"></script>
<script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/js/bootstrap.min.js"></script>
</body>
</html>
