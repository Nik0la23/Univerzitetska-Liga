<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Basketball Team</title>
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/css/bootstrap.min.css">
    <link rel="stylesheet" href="/css/premium-design-system.css">
    <style>
        .premium-header {
            background: linear-gradient(135deg, #000000 0%, #1a0f0a 50%, #ff6b35 100%);
            border-bottom: 4px solid #ff6b35;
            box-shadow: 0 8px 32px rgba(255,107,53,0.4);
            position: relative;
            overflow: hidden;
        }
        
        .premium-header::after {
            content: '';
            position: absolute;
            top: -50%;
            right: -10%;
            width: 200px;
            height: 200px;
            background: radial-gradient(circle, rgba(255,107,53,0.2) 0%, transparent 70%);
            border-radius: 50%;
            animation: bounce 3s infinite;
        }
        
        @keyframes bounce {
            0%, 100% { transform: translateY(0) scale(1); }
            50% { transform: translateY(-20px) scale(1.1); }
        }
        
        .premium-header h1 {
            font-family: 'Orbitron', monospace;
            font-weight: 900;
            font-size: 3rem;
            color: #fff;
            text-shadow: 0 0 20px rgba(255,107,53,0.8);
            margin: 0;
            position: relative;
            z-index: 2;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        
        @media (max-width: 768px) {
            .premium-header h1 {
                font-size: 2rem;
            }
        }
    </style>
</head>
<body>

<header class="premium-header text-white">
    <div class="container">
        <h1 class="mb-0">🏀 Edit Basketball Team</h1>
    </div>
</header>

<section class="premium-container section-spacing">
    <div class="row mb-5">
        <div class="col-12 text-center">
            <h2 class="page-title">
                ✏️ Edit Team Information
            </h2>
        </div>
    </div>
    
    <div class="premium-card">
        <form th:action="@{/basketball/teams/edit/{id}(id=${team.id})}" method="post" enctype="multipart/form-data" class="needs-validation" novalidate>
            
            <div class="form-group-premium">
                <label for="logo" class="form-label-premium">🏀 Team Logo</label>
                <input type="file" class="form-control-premium" id="logo" name="logo"
                       th:value="${team != null ? team.getLogo() : ''}" 
                       accept="image/*">
                <small class="form-text text-muted">Upload a new team logo (JPG, PNG, GIF)</small>
            </div>
            
            <div class="form-group-premium">
                <label for="teamName" class="form-label-premium">📝 Team Name</label>
                <input type="text" id="teamName" class="form-control-premium" 
                       th:field="*{team.teamName}" 
                       placeholder="Enter team name" 
                       required />
                <div class="invalid-feedback">
                    Please provide a valid team name.
                </div>
            </div>
            
            <div class="row">
                <div class="col-md-6">
                    <div class="form-group-premium">
                        <label for="teamLeaguePoints" class="form-label-premium">🏆 League Points</label>
                        <input type="number" id="teamLeaguePoints" class="form-control-premium" 
                               th:field="*{team.teamLeaguePoints}" 
                               readonly 
                               style="background-color: var(--gray-100); cursor: not-allowed;" />
                        <small class="form-text">This field is automatically calculated</small>
                    </div>
                </div>
                
                <div class="col-md-6">
                    <div class="form-group-premium">
                        <label for="teamMatchesPlayed" class="form-label-premium">🏁 Matches Played</label>
                        <input type="number" id="teamMatchesPlayed" class="form-control-premium" 
                               th:field="*{team.teamMatchesPlayed}" 
                               readonly 
                               style="background-color: var(--gray-100); cursor: not-allowed;" />
                        <small class="form-text">This field is automatically calculated</small>
                    </div>
                </div>
            </div>
            
            <div class="row">
                <div class="col-md-6">
                    <div class="form-group-premium">
                        <label for="teamWins" class="form-label-premium">✅ Wins</label>
                        <input type="number" id="teamWins" class="form-control-premium" 
                               th:field="*{team.teamWins}" 
                               readonly 
                               style="background-color: var(--gray-100); cursor: not-allowed;" />
                        <small class="form-text">Auto-calculated</small>
                    </div>
                </div>
                
                <div class="col-md-6">
                    <div class="form-group-premium">
                        <label for="teamLoses" class="form-label-premium">❌ Losses</label>
                        <input type="number" id="teamLoses" class="form-control-premium" 
                               th:field="*{team.teamLoses}" 
                               readonly 
                               style="background-color: var(--gray-100); cursor: not-allowed;" />
                        <small class="form-text">Auto-calculated</small>
                    </div>
                </div>
            </div>
            
            <div class="d-flex gap-3 justify-content-center mt-5">
                <button type="submit" class="btn btn-premium btn-success">💾 Save Changes</button>
                <a th:href="@{/basketball/teams}" class="btn btn-premium btn-secondary">❌ Cancel</a>
            </div>
        </form>
    </div>
</section>

<script>
// Bootstrap form validation
(function() {
    'use strict';
    window.addEventListener('load', function() {
        var forms = document.getElementsByClassName('needs-validation');
        var validation = Array.prototype.filter.call(forms, function(form) {
            form.addEventListener('submit', function(event) {
                if (form.checkValidity() === false) {
                    event.preventDefault();
                    event.stopPropagation();
                }
                form.classList.add('was-validated');
            }, false);
        });
    }, false);
})();
</script>

<script src="https://code.jquery.com/jquery-3.2.1.slim.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.11.0/umd/popper.min.js"></script>
<script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/js/bootstrap.min.js"></script>
</body>
</html>
