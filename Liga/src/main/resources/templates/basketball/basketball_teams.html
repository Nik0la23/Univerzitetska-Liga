<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Basketball Teams</title>
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/css/bootstrap.min.css">
    <link rel="stylesheet" href="/css/premium-design-system.css">
    <style>
        .premium-header {
            background: linear-gradient(135deg, #000000 0%, #1a0f0a 50%, #ff6b35 100%);
            border-bottom: 4px solid #ff6b35;
            box-shadow: 0 8px 32px rgba(255,107,53,0.4);
            position: relative;
            overflow: hidden;
        }
        
        .premium-header::after {
            content: '';
            position: absolute;
            top: -50%;
            right: -10%;
            width: 200px;
            height: 200px;
            background: radial-gradient(circle, rgba(255,107,53,0.2) 0%, transparent 70%);
            border-radius: 50%;
            animation: bounce 3s infinite;
        }
        
        @keyframes bounce {
            0%, 100% { transform: translateY(0) scale(1); }
            50% { transform: translateY(-20px) scale(1.1); }
        }
        
        .premium-header h1 {
            font-family: 'Orbitron', monospace;
            font-weight: 900;
            font-size: 3rem;
            color: #fff;
            text-shadow: 0 0 20px rgba(255,107,53,0.8);
            margin: 0;
            position: relative;
            z-index: 2;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        
        @media (max-width: 768px) {
            .premium-header h1 {
                font-size: 2rem;
            }
        }
    </style>
</head>
<body>

<header class="premium-header text-white">
    <div class="container">
        <h1 class="mb-0">🏀 Basketball Teams</h1>
    </div>
</header>

<section class="premium-container">
    <div class="row mb-4">
        <div class="col-12">
            <h2 class="text-premium" style="color: #ff6b35; font-size: var(--text-2xl); margin-bottom: var(--space-6);">
                🏀 All Basketball Teams
            </h2>
        </div>
    </div>
    
    <div class="text-center mb-4" th:if="${session.user != null and session.user.isAdmin}">
        <a th:href="@{/basketball/teams/add}" class="btn btn-premium btn-success">➕ Add New Team</a>
    </div>
    
    <div class="table-responsive">
        <table class="table-premium">
            <thead>
            <tr>
                <th>🏀 Team Logo</th>
                <th>👥 Team Name</th>
                <th>👁️ Details</th>
                <th th:if="${session.user != null and session.user.isAdmin}">✏️ Edit</th>
                <th th:if="${session.user != null and session.user.isAdmin}">🗑️ Delete</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="team : ${basketballTeams}">
                <td>
                    <img th:src="@{/basketball/teams/logo/{id}(id=${team.id})}" 
                         alt="Team Image" 
                         style="width:60px;height:60px;border-radius:50%;object-fit:cover;border:2px solid #ff6b35;"/>
                </td>
                <td class="text-premium" th:text="${team.teamName}"></td>
                <td>
                    <a th:href="@{/basketball/teams/team/{id}(id=${team.id})}" class="btn btn-premium btn-primary" style="padding: var(--space-2) var(--space-3); font-size: var(--text-xs);">👁️ Details</a>
                </td>
                <td th:if="${session.user != null and session.user.isAdmin}">
                    <a th:href="@{/basketball/teams/edit/{id}(id=${team.id})}" class="btn btn-premium btn-warning" style="padding: var(--space-2) var(--space-3); font-size: var(--text-xs);">✏️ Edit</a>
                </td>
                <td th:if="${session.user != null and session.user.isAdmin}">
                    <form th:method="POST" th:action="@{'/basketball/teams/delete/{id}'(id=${team.id})}" style="display:inline;">
                        <button type="submit" class="btn btn-premium btn-danger" style="padding: var(--space-2) var(--space-3); font-size: var(--text-xs);">🗑️ Delete</button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</section>

<script src="https://code.jquery.com/jquery-3.2.1.slim.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.11.0/umd/popper.min.js"></script>
<script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/js/bootstrap.min.js"></script>
</body>
</html>
