<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Live Basketball Matches</title>
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/css/bootstrap.min.css">
    <style>
        .quarters-table {
            width: 100%;
            margin-top: 20px;
            margin-bottom: 20px;
            border-collapse: collapse;
        }
        .quarters-table th, .quarters-table td {
            text-align: center;
            padding: 8px;
            border: 1px solid #ddd;
        }
        .quarters-table th {
            background-color: #f8f9fa;
        }
        .total-score {
            font-weight: bold;
            background-color: #e9ecef;
        }
    </style>
</head>
<body>
<header class="bg-primary text-white p-3">
    <div class="container">
        <h1 class="mb-0">Live Basketball Matches</h1>
    </div>
</header>
<div class="container mt-5">
    <div th:each="match : ${live}" class="mb-5">
        <h3 class="mb-3">
            <span th:text="${match.homeTeam.teamName}"></span>
            vs
            <span th:text="${match.awayTeam.teamName}"></span>
        </h3>
        
        <table class="quarters-table">
            <thead>
                <tr>
                    <th>Team</th>
                    <th>Q1</th>
                    <th>Q2</th>
                    <th>Q3</th>
                    <th>Q4</th>
                    <th>Total</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td th:text="${match.homeTeam.teamName}">Home Team</td>
                    <td th:text="${match.homeTeamQ1Points}">0</td>
                    <td th:text="${match.homeTeamQ2Points}">0</td>
                    <td th:text="${match.homeTeamQ3Points}">0</td>
                    <td th:text="${match.homeTeamQ4Points}">0</td>
                    <td class="total-score" th:text="${match.homeTeamPoints}">0</td>
                </tr>
                <tr>
                    <td th:text="${match.awayTeam.teamName}">Away Team</td>
                    <td th:text="${match.awayTeamQ1Points}">0</td>
                    <td th:text="${match.awayTeamQ2Points}">0</td>
                    <td th:text="${match.awayTeamQ3Points}">0</td>
                    <td th:text="${match.awayTeamQ4Points}">0</td>
                    <td class="total-score" th:text="${match.awayTeamPoints}">0</td>
                </tr>
            </tbody>
        </table>
        
        <div class="text-right">
            <a th:href="@{/basketball/matches/edit_live/{id}(id=${match.basketball_match_id})}" class="btn btn-warning">Edit Live Match</a>
        </div>
        <hr class="mt-4">
    </div>
</div>

<script src="https://code.jquery.com/jquery-3.2.1.slim.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.11.0/umd/popper.min.js"></script>
<script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/js/bootstrap.min.js"></script>
</body>
</html>
