<header class="premium-header text-white">
    <div class="container">
        <h1 class="mb-0">🏀 Basketball News</h1>
    </div>
</header>

<section class="premium-container section-spacing">
    <div class="row mb-5">
        <div class="col-12">
            <h2 class="page-title">🏀 Latest Basketball News</h2>
            <p class="text-premium-light" style="font-size: var(--text-lg);">Stay updated with the latest basketball news and updates</p>
        </div>
    </div>

    <div class="row">
        <!-- News Section (Left side) -->
        <div class="col-md-8">
            <div class="mb-4">
                <a th:href="@{/basketball/news/add}" class="btn-premium">📝 Add News</a>
            </div>

            <div th:each="news : ${basketballNews}" class="premium-card mb-4">
                <div class="d-flex justify-content-between align-items-start">
                    <div class="flex-grow-1">
                        <h3 class="text-premium mb-3" style="color: var(--accent-orange);" th:text="${news.title}">News Title</h3>
                        <p class="text-premium-light mb-2" style="font-size: var(--text-sm);" th:text="${news.publishedDate}">Published Date</p>
                        <p class="text-readable mb-3" th:text="${news.content}">News Content</p>
                    </div>
                    <!-- Buttons Section -->
                    <div class="d-flex flex-column gap-2">
                        <a th:href="@{/basketball/news/details/{id}(id=${news.news_id})}" class="btn-premium btn-sm">👁️ View</a>
                        <a th:href="@{/basketball/news/edit/{id}(id=${news.news_id})}" class="btn-premium btn-sm">✏️ Edit</a>
                        <a th:href="@{/basketball/news/delete/{id}(id=${news.news_id})}"
                           class="btn-premium btn-sm"
                           style="background: var(--accent-red);"
                           onclick="return confirm('Are you sure you want to delete this news?');">🗑️ Delete</a>
                    </div>
                </div>
            </div>
        </div>

        <!-- Top 5 Players Section (Right side) -->
        <div class="col-md-4">
            <div class="premium-card">
                <h3 class="text-premium mb-4" style="color: var(--accent-orange);">🏆 Top 5 Basketball Players</h3>
                <div class="list-group list-group-flush">
                    <div class="list-group-item border-0 px-0 py-3" th:each="player : ${topPlayers}">
                        <div class="d-flex justify-content-between align-items-center">
                            <strong class="text-readable" th:text="${player.name}">Player Name</strong>
                            <span class="badge-premium" style="background: var(--accent-orange);" th:text="${player.getTotalPoints()}">Score</span>
                        </div>
                    </div>
            </ul>
        </div>
    </div>
</div>
</body>
</html>
