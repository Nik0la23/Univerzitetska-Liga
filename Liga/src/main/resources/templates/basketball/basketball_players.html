<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Basketball Players</title>
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/css/bootstrap.min.css">
    <link rel="stylesheet" href="/css/premium-design-system.css">
</head>
<body>

<section class="premium-container section-spacing">
    <div class="row mb-5">
        <div class="col-12">
            <h2 class="page-title">
                👥 Basketball Players
            </h2>
            <p class="text-premium-light" style="font-size: var(--text-lg);">
                Manage and view all basketball players in the league
            </p>
        </div>
    </div>
    
    <div class="table-responsive">
        <table class="table-premium">
            <thead>
            <tr>
                <th>🖼️ Image</th>
                <th>👤 Player Name</th>
                <th>🎂 Birthdate</th>
                <th>🏙️ City</th>
                <th>🏀 Position</th>
                <th>🏆 Team</th>
                <th>⚙️ Actions</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="player : ${basketballPlayers}">
                <td>
                    <img th:src="@{/basketball/players/image/{id}(id=${player.basketball_player_id})}" 
                         alt="Player Image" 
                         style="width:60px;height:60px;border-radius:50%;object-fit:cover;border:2px solid var(--accent-orange);"/>
                </td>
                <td class="text-readable" th:text="${player.name} + ' ' + ${player.surname}"></td>
                <td class="text-readable" th:text="${#dates.format(player.birthdate, 'yyyy-MM-dd')}"></td>
                <td class="text-readable" th:text="${player.city}"></td>
                <td>
                    <span class="badge-premium badge-primary" th:text="${player.position}"></span>
                </td>
                <td class="text-readable" th:text="${player.team?.teamName}"></td>
                <td>
                    <div class="btn-group" role="group">
                        <a th:if="${session.user != null and session.user.isAdmin}" th:href="@{/basketball/players/edit/{id}(id=${player.basketball_player_id})}" 
                           class="btn btn-premium btn-warning" style="padding: var(--space-2) var(--space-3); font-size: var(--text-xs);">✏️ Edit</a>
                        <a th:href="@{/basketball/players/details/{id}(id=${player.basketball_player_id})}" 
                           class="btn btn-premium btn-primary" style="padding: var(--space-2) var(--space-3); font-size: var(--text-xs);">👁️ Details</a>
                        <form th:if="${session.user != null and session.user.isAdmin}" th:method="POST" th:action="@{/basketball/players/delete/{id} (id=${player.basketball_player_id})}" style="display:inline;">
                            <button type="submit" class="btn btn-premium btn-danger" style="padding: var(--space-2) var(--space-3); font-size: var(--text-xs);">🗑️ Delete</button>
                        </form>
                    </div>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
    
    <div class="text-center mt-4" th:if="${session.user != null and session.user.isAdmin}">
        <a type="button" class="btn btn-premium btn-success" href="/basketball/players/add-form">➕ Add New Player</a>
    </div>
</section>


<section class="premium-container section-spacing">
    <div class="row mb-5">
        <div class="col-12">
            <h3 class="section-title">
                🏆 Top 5 Basketball Players
            </h3>
        </div>
    </div>
    
    <div class="table-responsive">
        <table class="table-premium">
            <thead>
            <tr>
                <th>🖼️ Image</th>
                <th>👤 Player Name</th>
                <th>🎯 Points</th>
                <th>🎯 Assists</th>
                <th>🏀 Rebounds</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="player : ${topPlayers}">
                <td>
                    <img th:src="@{/basketball/players/image/{id}(id=${player.basketball_player_id})}" 
                         alt="Player Image" 
                         style="width:60px;height:60px;border-radius:50%;object-fit:cover;border:2px solid var(--accent-orange);"/>
                </td>
                <td class="text-readable" th:text="${player.name} + ' ' + ${player.surname}"></td>
                <td>
                    <span class="badge-premium badge-success" th:text="${player.getPoints()}"></span>
                </td>
                <td>
                    <span class="badge-premium badge-primary" th:text="${player.getAssists()}"></span>
                </td>
                <td>
                    <span class="badge-premium badge-warning" th:text="${player.getRebounds()}"></span>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</section>

<script src="https://code.jquery.com/jquery-3.2.1.slim.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.11.0/umd/popper.min.js"></script>
<script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/js/bootstrap.min.js"></script>
</body>
</html>
