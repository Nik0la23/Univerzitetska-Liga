<header class="premium-header text-white">
    <div class="container">
        <h1 class="mb-0">🏀 Edit Basketball News</h1>
    </div>
</header>

<section class="premium-container section-spacing">
    <div class="row mb-5">
        <div class="col-12">
            <h2 class="page-title">📰 Update News Article</h2>
            <p class="text-premium-light" style="font-size: var(--text-lg);">Edit basketball news article content and details</p>
        </div>
    </div>

    <form th:action="@{/basketball/news/edit/{id}(id=${news.news_id})}" th:object="${news}" method="post" class="needs-validation" novalidate>
        <div class="form-group-premium">
            <label for="title" class="form-label-premium">📰 News Title</label>
            <input type="text" class="form-control-premium" id="title" name="title" th:field="*{title}" required placeholder="Enter news title">
            <div class="invalid-feedback">Please enter the news title.</div>
        </div>

        <div class="form-group-premium">
            <label for="content" class="form-label-premium">📝 News Content</label>
            <textarea class="form-control-premium" id="content" name="content" th:field="*{content}" required placeholder="Enter news content" rows="10"></textarea>
            <div class="invalid-feedback">Please enter the news content.</div>
        </div>

        <div class="d-flex gap-3 mt-4">
            <button type="submit" class="btn-premium">💾 Update News</button>
            <a type="button" class="btn-premium" href="/basketball/news" style="background: var(--gray-600);">⬅️ Back to News List</a>
        </div>
    </form>
</section>

<script>
    (function () {
        'use strict';
        window.addEventListener('load', function () {
            var forms = document.getElementsByClassName('needs-validation');
            Array.prototype.filter.call(forms, function (form) {
                form.addEventListener('submit', function (event) {
                    if (form.checkValidity() === false) {
                        event.preventDefault();
                        event.stopPropagation();
                    }
                    form.classList.add('was-validated');
                }, false);
            });
        }, false);
    })();
</script>
