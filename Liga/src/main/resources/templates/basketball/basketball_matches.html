<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Basketball Matches</title>
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/css/bootstrap.min.css">
    <link rel="stylesheet" href="/css/premium-design-system.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700;900&family=Roboto:wght@300;400;500;600&display=swap');
        
        body {
            font-family: 'Roboto', sans-serif;
            background: linear-gradient(135deg, #1a1a1a 0%, #2c1810 50%, #ff6b35 100%);
            min-height: 100vh;
            color: #333;
            position: relative;
            overflow-x: hidden;
            scroll-behavior: smooth;
        }
        
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><circle cx="20" cy="30" r="15" fill="none" stroke="rgba(255,107,53,0.1)" stroke-width="2"/><circle cx="80" cy="70" r="20" fill="none" stroke="rgba(255,152,0,0.1)" stroke-width="1"/><circle cx="50" cy="10" r="8" fill="rgba(255,107,53,0.05)"/></svg>');
            animation: basketballFloat 25s infinite linear;
            z-index: -1;
        }
        
        @keyframes basketballFloat {
            0% { transform: translateX(-50px) rotate(0deg); }
            100% { transform: translateX(calc(100vw + 50px)) rotate(360deg); }
        }
        
        .premium-header {
            background: linear-gradient(135deg, #000000 0%, #1a0f0a 50%, #ff6b35 100%);
            border-bottom: 4px solid #ff6b35;
            box-shadow: 0 8px 32px rgba(255,107,53,0.4);
            position: relative;
            overflow: hidden;
        }
        
        .premium-header::after {
            content: '';
            position: absolute;
            top: -50%;
            right: -10%;
            width: 200px;
            height: 200px;
            background: radial-gradient(circle, rgba(255,107,53,0.2) 0%, transparent 70%);
            border-radius: 50%;
            animation: bounce 3s infinite;
        }
        
        @keyframes bounce {
            0%, 100% { transform: translateY(0) scale(1); }
            50% { transform: translateY(-20px) scale(1.1); }
        }
        
        .premium-header h1 {
            font-family: 'Orbitron', monospace;
            font-weight: 900;
            font-size: 3rem;
            color: #fff;
            text-shadow: 0 0 20px rgba(255,107,53,0.8);
            margin: 0;
            position: relative;
            z-index: 2;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        @media (max-width: 768px) {
            .premium-header h1 {
                font-size: 2rem;
            }
        }
        
        .premium-nav {
            background: rgba(255,255,255,0.95);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255,107,53,0.3);
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
        }
        
        .premium-nav .nav-link {
            color: #ff6b35 !important;
            font-weight: 500;
            padding: 15px 20px !important;
            margin: 0 5px;
            border-radius: 8px;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }
        
        .premium-nav .nav-link::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,107,53,0.2), transparent);
            transition: left 0.5s ease;
        }
        
        .premium-nav .nav-link:hover::before {
            left: 100%;
        }
        
        .premium-nav .nav-link:hover {
            background: linear-gradient(135deg, #ff6b35, #ff8a65);
            color: white !important;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(255,107,53,0.3);
        }

        .premium-container {
            background: rgba(255,255,255,0.95);
            backdrop-filter: blur(15px);
            border-radius: 25px;
            padding: 50px;
            margin: 40px auto;
            max-width: 1200px;
            box-shadow: 0 25px 80px rgba(0,0,0,0.2);
            border: 2px solid rgba(255,107,53,0.2);
            position: relative;
            z-index: 1;
        }
        
        .premium-container::before {
            content: '';
            position: absolute;
            top: -2px;
            left: -2px;
            right: -2px;
            bottom: -2px;
            background: linear-gradient(45deg, #ff6b35, #ff8a65, #ffab40, #ff6b35);
            border-radius: 25px;
            z-index: -1;
            animation: gradientShift 4s ease infinite;
        }
        
        @keyframes gradientShift {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }
        
        .match-date {
            font-family: 'Orbitron', monospace;
            font-size: 2rem;
            font-weight: 700;
            color: #ff6b35;
            margin: 40px 0 25px 0;
            text-align: center;
            position: relative;
            padding-bottom: 20px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        
        .match-date::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 100px;
            height: 4px;
            background: linear-gradient(90deg, #ff6b35, #ff8a65, #ff6b35);
            border-radius: 2px;
            animation: glow 2s ease-in-out infinite;
        }
        
        @keyframes glow {
            0%, 100% { box-shadow: 0 0 5px rgba(255,107,53,0.5); }
            50% { box-shadow: 0 0 20px rgba(255,107,53,0.8); }
        }
        
        .match-card {
            background: linear-gradient(135deg, #fff 0%, #fff8f5 100%);
            border: none;
            border-radius: 20px;
            padding: 30px;
            margin: 20px 0;
            box-shadow: 0 15px 35px rgba(255,107,53,0.1);
            transition: all 0.5s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            position: relative;
            overflow: hidden;
            transform-style: preserve-3d;
        }
        
        .match-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 6px;
            height: 100%;
            background: linear-gradient(180deg, #ff6b35, #ff8a65);
            transform: scaleY(0);
            transition: transform 0.4s ease;
            border-radius: 0 3px 3px 0;
        }
        
        .match-card::after {
            content: '';
            position: absolute;
            top: -50%;
            right: -50%;
            width: 200px;
            height: 200px;
            background: radial-gradient(circle, rgba(255,107,53,0.05) 0%, transparent 70%);
            border-radius: 50%;
            transition: all 0.5s ease;
        }
        
        .match-card:hover::before {
            transform: scaleY(1);
        }
        
        .match-card:hover::after {
            top: -30%;
            right: -30%;
            background: radial-gradient(circle, rgba(255,107,53,0.1) 0%, transparent 70%);
        }
        
        .match-card:hover {
            transform: translateY(-12px) rotateX(5deg);
            box-shadow: 0 25px 50px rgba(255,107,53,0.2);
        }
        
        .match-link {
            display: block;
            width: 100%;
            color: inherit;
            text-decoration: none;
            position: relative;
            z-index: 2;
        }
        
        .match-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        
        .match-details {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 35px;
        }
        
        .team-name {
            font-size: 1.4rem;
            color: #1a1a1a;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.1);
            transition: all 0.3s ease;
        }
        
        .match-card:hover .team-name {
            color: #ff6b35;
            transform: scale(1.05);
        }
        
        .match-time {
            font-family: 'Orbitron', monospace;
            font-size: 1.2rem;
            padding: 15px 25px;
            background: linear-gradient(135deg, #ff6b35, #ff8a65);
            color: white;
            border-radius: 30px;
            font-weight: 700;
            box-shadow: 0 6px 20px rgba(255,107,53,0.4);
            min-width: 100px;
            text-align: center;
            position: relative;
            overflow: hidden;
        }
        
        .match-time::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
            transition: left 0.5s ease;
        }
        
        .match-card:hover .match-time::before {
            left: 100%;
        }
        
        .vs-text {
            font-family: 'Orbitron', monospace;
            font-size: 1.3rem;
            color: #ff6b35;
            font-weight: 600;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.1);
        }
        
        .actions {
            display: flex;
            gap: 15px;
            align-items: center;
            margin-top: 20px;
            justify-content: center;
        }
        
        .btn-premium {
            padding: 12px 20px;
            border-radius: 25px;
            font-weight: 600;
            font-size: 0.9rem;
            border: none;
            transition: all 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            text-transform: uppercase;
            letter-spacing: 1px;
            position: relative;
            overflow: hidden;
        }
        
        .btn-premium::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            background: rgba(255,255,255,0.2);
            border-radius: 50%;
            transition: all 0.4s ease;
            transform: translate(-50%, -50%);
        }
        
        .btn-premium:hover::before {
            width: 300px;
            height: 300px;
        }
        
        .btn-premium.btn-warning {
            background: linear-gradient(135deg, #FF9800, #FFB74D);
            color: white;
            box-shadow: 0 6px 20px rgba(255,152,0,0.4);
        }
        
        .btn-premium.btn-success {
            background: linear-gradient(135deg, #4CAF50, #66BB6A);
            color: white;
            box-shadow: 0 6px 20px rgba(76,175,80,0.4);
        }
        
        .btn-premium.btn-danger {
            background: linear-gradient(135deg, #F44336, #EF5350);
            color: white;
            box-shadow: 0 6px 20px rgba(244,67,54,0.4);
        }
        
        .btn-premium:hover {
            transform: translateY(-3px) scale(1.05);
            box-shadow: 0 12px 30px rgba(0,0,0,0.3);
        }
        
        .playoff-badge {
            background: linear-gradient(135deg, #ff6b35, #ff8a65);
            color: white;
            padding: 8px 16px;
            border-radius: 25px;
            font-size: 0.8rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: 0 4px 15px rgba(255,107,53,0.4);
            position: absolute;
            top: 20px;
            right: 20px;
            animation: basketballSpin 3s infinite;
            z-index: 3;
        }
        
        @keyframes basketballSpin {
            0%, 100% { transform: rotate(0deg) scale(1); }
            25% { transform: rotate(90deg) scale(1.1); }
            50% { transform: rotate(180deg) scale(1); }
            75% { transform: rotate(270deg) scale(1.1); }
        }
        
        .basketball-icon {
            position: absolute;
            top: 50%;
            right: 40px;
            transform: translateY(-50%);
            font-size: 2.5rem;
            color: rgba(255,107,53,0.15);
            z-index: 1;
            animation: dribble 2s ease-in-out infinite;
        }
        
        @keyframes dribble {
            0%, 100% { transform: translateY(-50%) scale(1); }
            50% { transform: translateY(-60%) scale(1.1); }
        }
        
        @media (max-width: 768px) {
            .match-details {
                flex-direction: column;
                gap: 20px;
            }
            
            .actions {
                flex-direction: column;
                width: 100%;
            }
            
            .premium-container {
                margin: 20px;
                padding: 25px;
            }
            
        }
    </style>
</head>
<body>
<header class="premium-header text-white p-4">
    <div class="container">
        <h1 class="mb-0">🏀 Basketball Matches</h1>
    </div>
</header>

<nav class="navbar navbar-expand-lg premium-nav">
    <div class="container">
        <div class="collapse navbar-collapse">
            <ul class="navbar-nav mr-auto">
                <li class="nav-item">
                    <a href="/basketball/news" class="nav-link">📰 News</a>
                </li>
                <li class="nav-item">
                    <a href="/basketball/matches/add-form" class="nav-link">➕ Add Match</a>
                </li>
                <li class="nav-item">
                    <a href="/basketball/matches/live" class="nav-link">🔴 Live Matches</a>
                </li>
                <li class="nav-item">
                    <a href="/basketball/matches/fixtures" class="nav-link">📅 Fixtures</a>
                </li>
                <li class="nav-item">
                    <a href="/basketball/matches/results" class="nav-link">📊 Results</a>
                </li>
                <li class="nav-item">
                    <a href="/basketball/players" class="nav-link">👥 Players</a>
                </li>
                <li class="nav-item">
                    <a href="/basketball/teams/standings" class="nav-link">🏆 Standings</a>
                </li>
                <li class="nav-item">
                    <a href="/basketball/matches/playoffs/init" class="nav-link">⚡ Playoffs</a>
                </li>
            </ul>
        </div>
    </div>
</nav>

<section class="premium-container">
    <div th:each="entry : ${groupedMatches}">
        <h3 class="match-date" th:text="${#temporals.format(entry.key, 'EEEE dd MMMM yyyy')}"></h3>
        <div th:each="match : ${entry.value}" class="match-card">
            <span th:if="${match.isPlayoffMatch}" class="playoff-badge">🏆 Playoff</span>
            <div class="basketball-icon">🏀</div>
            <a th:href="@{/basketball/matches/details/{id}(id=${match.basketball_match_id})}" class="match-link">
                <div class="match-row">
                    <div class="match-details">
                        <span class="team-name" th:text="${match.homeTeam.teamName}"></span>
                        <span class="vs-text">vs</span>
                        <span class="team-name" th:text="${match.awayTeam.teamName}"></span>
                        <span class="match-time" th:text="${#temporals.format(match.startTime, 'HH:mm')}"></span>
                    </div>
                </div>
            </a>
            <div class="actions">
                <a th:href="@{/basketball/matches/edit-form/{id}(id=${match.basketball_match_id})}" class="btn btn-warning btn-premium">✏️ Edit</a>
                <form th:if="${!match.isPlayoffMatch}" th:method="POST" th:action="@{'/basketball/matches/finish/{id}'(id=${match.basketball_match_id})}" style="display:inline;" onsubmit="return confirmFinish(this)">
                    <button type="submit" class="btn btn-success btn-premium">✅ Finish</button>
                </form>
                <form th:method="POST" th:action="@{'/basketball/matches/delete/{id}'(id=${match.basketball_match_id})}" style="display:inline;">
                    <button type="submit" class="btn btn-danger btn-premium">🗑️ Delete</button>
                </form>
            </div>
        </div>
    </div>
</section>

<script>
    // Function to check if the match is a draw and toggle the Finish button
    function checkScoresAndToggleFinish() {
        const homeTeamScore = parseInt(document.getElementById('homeTeamScoreInput').value, 10);
        const awayTeamScore = parseInt(document.getElementById('awayTeamScoreInput').value, 10);
        const finishButton = document.getElementById('finish-button');

        // Disable button if it's a draw, otherwise enable
        finishButton.disabled = homeTeamScore === awayTeamScore;
    }

    // Set up event listeners if you're using input fields for scores
    document.getElementById('homeTeamScoreInput').addEventListener('change', checkScoresAndToggleFinish);
    document.getElementById('awayTeamScoreInput').addEventListener('change', checkScoresAndToggleFinish);
</script>

<script src="https://code.jquery.com/jquery-3.2.1.slim.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.11.0/umd/popper.min.js"></script>
<script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/js/bootstrap.min.js"></script>
</body>
</html>
