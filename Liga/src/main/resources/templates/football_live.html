<header class="premium-header text-white">
    <div class="container">
        <h1 class="mb-0">🔴 Football Live Matches</h1>
    </div>
</header>

<section class="premium-container section-spacing">
    <div class="row mb-5">
        <div class="col-12">
            <h2 class="page-title">
                🔴 Live Matches
            </h2>
            <p class="text-premium-light" style="font-size: var(--text-lg);">
                View currently ongoing football matches and update scores in real-time
            </p>
        </div>
    </div>
    
    <div class="table-responsive">
        <table class="table-premium">
            <thead>
            <tr>
                <th>🏠 Home Team</th>
                <th>✈️ Away Team</th>
                <th>📊 Current Score</th>
                <th>⚙️ Actions</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="match : ${live}">
                <td class="text-readable" th:text="${match.homeTeam.teamName}"></td>
                <td class="text-readable" th:text="${match.awayTeam.teamName}"></td>
                <td>
                    <span class="badge-premium badge-danger" th:text="${match.homeTeamPoints} + ' - ' + ${match.awayTeamPoints}">LIVE</span>
                </td>
                <td>
                    <a th:href="@{/matches/edit_live/{id}(id=${match.getFootball_match_id()})}" 
                       class="btn btn-premium btn-warning" style="padding: var(--space-2) var(--space-3); font-size: var(--text-xs);">✏️ Edit Live</a>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
    
    <div class="text-center mt-4">
        <button type="button" class="btn btn-premium btn-secondary" onclick="window.history.back()">⬅️ Back</button>
    </div>
</section>
